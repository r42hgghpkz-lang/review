<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>审阅</title><style>*{box-sizing:border-box}:root{--bg:#faf8f3;--fg:#2b2b2b;--mu:#888;--ac:#c0392b;--card:#fff;--bd:#e6e0d4}@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1c1e;--fg:#d8d4cc;--mu:#888;--ac:#e0705f;--card:#242528;--bd:#34353a}}:root[data-theme=dark]{--bg:#1b1c1e;--fg:#d8d4cc;--mu:#888;--ac:#e0705f;--card:#242528;--bd:#34353a}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 "PingFang SC","Noto Sans CJK SC",sans-serif}header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;z-index:3}header b{flex:1}a{color:var(--ac)}
button{font:inherit;color:var(--fg);border:1px solid var(--bd);background:var(--card);border-radius:6px;padding:4px 10px;cursor:pointer}.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px;max-width:1300px;margin:auto}@media(max-width:860px){.cols{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:10px;display:block;text-decoration:none;color:var(--fg)}.card:hover{border-color:var(--ac)}.top{display:flex;gap:8px;align-items:center}.top b{flex:1}
.tag{font-size:12px;padding:1px 8px;border-radius:10px;color:#fff}.t0{background:#d35400}.t1{background:#2e8b57}.t2{background:#8e44ad}.sc{font-size:13px;color:var(--mu);margin-top:4px}.sc span{margin-right:8px}.sc i{font-style:normal;color:var(--fg)}
table{border-collapse:collapse;width:100%;max-width:1000px;margin:16px auto}td,th{border-bottom:1px solid var(--bd);padding:8px;text-align:left;vertical-align:top}h2{margin:4px 0 12px;font-size:18px}
#gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9}#gate form{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:20px;width:min(340px,90vw)}#gate input[type=password]{width:100%;font-size:16px;padding:8px;margin:8px 0;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg)}</style></head><body><header><b>审阅台</b><a href="pipeline.html">修仙</a><a href="shenming.html" aria-current="page">神明</a><a href="index.html">章节</a><a href="log.html">记录</a><button id="th">◐</button></header><div id="app"></div><script>function render(X){// D-20261013-2305-books
let h='<div style="max-width:900px;margin:16px auto;padding:0 16px"><h2>神明 · '+esc(X.ch)+'</h2><div class="sc">更新 '+esc(X.updated)+(X.revise?' · 已整章改 '+X.revise+' 轮':'')+'</div>';
if(X.entry)h+='<a href="'+esc(X.entry.url)+'" class="card" style="display:block;border:2px solid var(--ac);text-decoration:none;margin:12px 0"><div class="top" style="display:flex;flex-wrap:wrap;gap:8px;align-items:center"><b style="font-size:18px;color:var(--ac)">▶ 当前章：'+esc(X.entry.label)+'（'+esc(X.entry.kind)+'）</b><span class="tag t2">'+esc(X.entry.status)+'</span></div><div>所处步骤：'+esc(X.step||'—')+'　·　在等：'+esc(X.wait)+'</div>'+(X.step=='打回·待复盘'?'<div style="margin-top:6px;padding:6px 10px;background:var(--ac);color:#fff;border-radius:6px;font-weight:bold">▶ 复盘追问单待你回答 · 点此进入（在审阅页顶部）</div>':'')+'<div class="sc">点此打开审阅页 · 稿更新 '+esc(X.entry.updated)+'</div></a>';
else h+='<div class="card">当前章：'+esc(X.ch)+' · 暂无审阅稿</div>';
h+='<div style="display:flex;flex-wrap:wrap;gap:6px;margin:14px 0">'+X.flow.map((f,i)=>'<span class="tag" style="padding:4px 10px;font-size:14px;'+(i==X.cur?'background:var(--ac);color:#fff;font-weight:bold':i<X.cur?'background:#2e8b57;color:#fff':'background:var(--card);color:var(--mu);border:1px solid var(--bd)')+'">'+esc(f)+'</span>').join('<span style="color:var(--mu)">→</span>')+'</div>';
h+='<div class="card"><b>现在在等：</b>'+esc(X.wait)+(X.model?'<div class="sc">模型 <i>'+esc(X.model)+'</i></div>':'')+'</div>';
if(X.esc)h+='<div class="card" style="border-color:var(--ac)"><b style="color:var(--ac)">停线 '+esc(X.esc.time)+'</b><div>'+esc(X.esc.message)+'</div></div>';
h+='<div style="overflow-x:auto"><table><tr><th>步骤</th><th>开始</th><th>结束</th><th>用时</th><th>次数</th><th>模型</th></tr>'+(X.rows||[]).map(r=>'<tr><td>'+esc(r.step)+'</td><td>'+esc(r.start)+'</td><td>'+esc(r.end)+'</td><td>'+(r.sec<60?r.sec+' 秒':Math.round(r.sec/60)+' 分')+(r.end?'':' · 进行中')+'</td><td>'+(r.n||'—')+'</td><td style="overflow-wrap:anywhere">'+esc(r.model)+'</td></tr>').join('')+'</table></div>';
h+='<h2>过去已锁定章节</h2>';
(X.past_locked||[]).forEach(c=>{h+='<'+(c.url?'a href="'+esc(c.url)+'"':'div')+' class="card"><div class="top"><b>'+esc(c.ch)+'</b><span class="tag t1">'+esc(c.status)+'</span></div><div class="sc">正文只读浏览 · '+esc(c.updated)+'</div></'+(c.url?'a':'div')+'>'});
if(!(X.past_locked||[]).length)h+='<div class="sc">暂无已锁定正文</div>';
h+='<div class="card" aria-disabled="true">'+esc(X.placeholder||'修订／精校（神明流程不同，暂未开放）')+'</div></div>';
document.getElementById('app').innerHTML=h;}</script><div id="gate"><form id="gf"><div>请输入阅读密码</div><input id="gp" type="password" autocomplete="current-password"><label style="font-size:14px"><input type="checkbox" id="gr"> 记住密码（仅本机）</label><br><button style="width:100%;margin-top:10px;background:var(--ac);color:#fff;border:0;padding:8px">打开</button><div id="gm" style="color:var(--ac);font-size:13px;margin-top:6px"></div></form></div>
