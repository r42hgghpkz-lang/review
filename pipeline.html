<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>流水线</title><style>*{box-sizing:border-box}:root{--bg:#faf8f3;--fg:#2b2b2b;--mu:#888;--ac:#c0392b;--card:#fff;--bd:#e6e0d4}@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1c1e;--fg:#d8d4cc;--mu:#888;--ac:#e0705f;--card:#242528;--bd:#34353a}}:root[data-theme=dark]{--bg:#1b1c1e;--fg:#d8d4cc;--mu:#888;--ac:#e0705f;--card:#242528;--bd:#34353a}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 "PingFang SC","Noto Sans CJK SC",sans-serif}header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;gap:12px;align-items:center;z-index:3}header b{flex:1}a{color:var(--ac)}
button{font:inherit;color:var(--fg);border:1px solid var(--bd);background:var(--card);border-radius:6px;padding:4px 10px;cursor:pointer}
.tag{font-size:12px;padding:1px 8px;border-radius:10px;color:#fff;white-space:nowrap}.t0{background:#d35400}.t1{background:#2e8b57}.t2{background:#8e44ad}.t3{background:#c00;font-weight:bold}
#gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9}#gate form{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:20px;width:min(340px,90vw)}#gate input[type=password]{width:100%;font-size:16px;padding:8px;margin:8px 0;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg)}

.wrap{overflow:auto;max-width:100%;padding:0 12px 24px}
table{border-collapse:collapse;width:100%;min-width:1100px;font-size:13px;margin:0 auto}
th,td{border-bottom:1px solid var(--bd);padding:7px 8px;text-align:left;vertical-align:top}
th{color:var(--mu);font-weight:600;position:sticky;top:42px;background:var(--bg)}
tr.hot{background:color-mix(in srgb,var(--ac) 8%,transparent)}
.mu{color:var(--mu);font-size:12px}
.pbar{display:flex;gap:2px;margin-top:4px;flex-wrap:wrap}.pbar i{width:10px;height:10px;border-radius:2px;display:inline-block;background:#bbb}.pbar i.sdone{background:#2e8b57}.pbar i.srun{background:#2980b9;animation:pulse 1.2s infinite}.pbar i.sfail{background:#c0392b}.pbar i.swait{background:#bdc3c7}@keyframes pulse{0%{opacity:1}50%{opacity:.45}100%{opacity:1}}@media(max-width:600px){.pbar i{width:12px;height:12px}}.seat.ok{color:#2e8b57}.seat.bad{color:var(--ac)}.seat.warn{color:#d35400}
.sum{max-width:1300px;margin:12px auto;padding:12px 14px}
.steps{display:flex;flex-wrap:wrap;gap:3px;align-items:center;margin-top:6px;min-width:230px}.step{border:1px solid var(--bd);border-radius:4px;padding:1px 4px;color:var(--mu);background:var(--card);font-size:12px}.step.sdone{color:var(--fg)}.step.srun{color:var(--fg);border-color:var(--ac);font-weight:bold}.step.sfail{color:var(--ac);border-color:var(--ac)}
/* D-20261013-2305-books：窄屏按章卡片展示，使用站点深色变量。 */
@media(max-width:760px){header{flex-wrap:wrap;gap:8px}.wrap table{min-width:0}.wrap thead{display:none}.wrap tbody{display:block}.wrap tr{display:block;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px;margin-bottom:12px}.wrap td{display:grid;grid-template-columns:85px minmax(0,1fr);gap:8px;overflow-wrap:anywhere}.wrap td:before{content:attr(data-label);color:var(--mu)}.steps{min-width:0;grid-column:2}.wrap tr.hot{border-color:var(--ac)}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px}
h2{max-width:1300px;margin:16px auto 8px;padding:0 12px;font-size:16px}
</style></head><body><header><b>审阅台 · 流水线</b><a href="pipeline.html" aria-current="page">修仙</a><a href="shenming.html">神明</a><a href="index.html">章节</a><a href="log.html">记录</a><button id="th">◐</button></header><div id="app"></div><script>function render(X){
const PHASE_CLS={
  '告警':'t2',
  '锁定':'t1','已锁定':'t1','待拍板':'t0','打回改中':'t2','按作者意见改稿中':'t0','按作者意见复评中':'t0','打回改骨':'t2',
  '章骨已改·待复评':'t0','章骨预检中':'t0','章骨待预检':'t0','可派写手':'t1','可写':'t1','创作中':'t0','章骨补全中':'t0','等待上一章':'t1','等作者拍板':'t3','作者打回·整改中':'t0','已交稿':'t1','评审中':'t0','排版检查中':'t0','排版自动修中':'t0','设定评审中':'t0','四席评审中':'t0','五席评审中':'t0','改稿中':'t0','按作者意见改稿中':'t0','复评中':'t0','推审阅页中':'t0',
  '评审中':'t0','写稿中':'t0','章骨未写':''
};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function miniProgress(r){
  let p=r.steps||r.progress||[]; if(!p.length)return '';
  const labels={done:'已完成',run:'进行中',fail:'待处理',wait:'待开始',skip:'已跳过'};
  let h='<div class="steps" title="总进度 '+(r.progress_pct||0)+'%">';
  p.forEach((x,i)=>{if(i)h+='<span class="mu">→</span>';h+='<span class="step s'+esc(x.state)+'" title="'+esc(labels[x.state]||x.state)+'">'+esc(x.label)+'</span>';});
  h+='</div>'; return h;
}
function tag(ph){return '<span class="tag '+(PHASE_CLS[ph]||'')+'">'+esc(ph)+'</span>';}
function cellSeat(v){
  v=String(v||'—');
  let cls='';
  if(/过|直过|硬伤0|零硬伤/.test(v)&&!/不过|过期|打回/.test(v))cls='ok';
  else if(/不过|打回|过期|不可|未识别|告警|卡死/.test(v))cls='bad';
  else if(/进行|待|豁免/.test(v))cls='warn';
  return '<span class="seat '+cls+'">'+esc(v)+'</span>';
}
let rows=X.rows||[];
let focus=rows.filter(r=>r.priority);
let rest=rows.filter(r=>!r.priority);
function table(list,title){
  if(!list.length)return '';
  let h='<h2>'+esc(title)+' <span class="mu">'+list.length+' 章</span></h2>';
  h+='<div class="wrap"><table><thead><tr>';
  ['章','现态','轮次','设定','行为','商业','审美','读者','卡点／时长','下一动作','总耗时','更新'].forEach(c=>h+='<th>'+c+'</th>');
  h+='</tr></thead><tbody>';
  list.forEach(r=>{
    let ch=esc(r.ch);
    if(r.review_url)ch='<a href="'+esc(r.review_url.split('/review/')[1]||('c/'+(r.review_url.split('/c/')[1]||'')))+'">'+ch+'</a>';
    // relative link if possible
    if(r.review_url&&r.review_url.indexOf('/c/')>=0){
      let id=r.review_url.split('/c/')[1];
      ch='<a href="c/'+esc(id)+'">'+esc(r.ch)+'</a>';
    }
    let stuck=esc(r.stuck||'—');
    if(r.stuck_for&&r.stuck_for!=='—')stuck+=' <span class="mu">'+esc(r.stuck_for)+'</span>';
    h+='<tr class="'+(r.phase==='待拍板'||r.phase==='打回改骨'||r.phase==='章骨已改·待复评'?'hot':'')+'">';
    h+='<td data-label="章"><b>'+ch+'</b></td>';
    h+='<td data-label="现态">'+tag(r.phase)+(!r.polish_skipped&&(r.polish||{}).state==='待作者审'?'<div><span class="tag t0">精校待审</span> '+(r.review_url?'<a href="c/'+esc(r.review_url.split('/c/')[1])+'">审阅精校</a>':'')+'</div>':'')+'</td>';
    h+='<td data-label="轮次" class="mu">'+esc(r.round)+'</td>';
    h+='<td data-label="设定">'+cellSeat(r.setting)+'</td>';
    h+='<td data-label="行为">'+cellSeat(r.behavior)+'</td>';
    h+='<td data-label="商业">'+cellSeat(r.commercial)+'</td>';
    h+='<td data-label="审美">'+cellSeat(r.aesthetic)+'</td>';
    h+='<td data-label="读者">'+cellSeat(r.reader)+'</td>';
    h+='<td data-label="卡点／时长">'+stuck+'</td>';
    h+='<td data-label="下一动作">'+esc(r.next)+miniProgress(r)+'</td>';
    h+='<td data-label="总耗时" class="mu" title="起 '+esc(r.started)+'">'+esc(r.elapsed)+'</td>';
    h+='<td data-label="更新" class="mu">'+esc(r.updated)+'</td>';
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  return h;
}
let stuckN=rows.filter(r=>['待拍板','打回改骨','待商业豁免','章骨已改·待复评','章骨预检中','打回改中'].includes(r.phase)).length;
let head='<div class="sum card"><b>修旧流水线</b> · 生成 '+esc(X.generated)+' · 卡点 '+stuckN+' 章';
let polishPending=rows.filter(r=>!r.polish_skipped&&(r.polish||{}).state==='待作者审');
if(polishPending.length)head+='<div><b>精校待审 '+polishPending.length+' 章</b> · '+polishPending.map(r=>r.review_url?'<a href="c/'+esc(r.review_url.split('/c/')[1])+'">'+esc(r.ch)+'</a>':esc(r.ch)).join(' · ')+'</div>';
let polishSkipped=rows.filter(r=>r.polish_skipped);
if(polishSkipped.length)head+='<div><b>精校跳过</b> · '+polishSkipped.map(r=>esc(r.ch)+' 精校跳过：'+esc(r.polish_skip_reason||'未知')).join(' · ')+'</div>';
head+='<div class="mu" style="margin-top:6px">商业：≥93 直过 · 90＜分＜93 自动放行（标「商业 N·自动放行」） · ≤90 打回。设定：零硬伤过线。收据 content_sha256 与章骨剧情内容不一致标「过期」（格式改不动）。刷新：流水线近实时推送（防抖60s）。</div><div class="mu" id="lu">最后更新：见 pipeline-dashboard.json last_update_hkt</div></div>';
let PLN=X.planning||{};let pm=PLN.margins||{};
let plan='<div class="sum card"'+(PLN.red?' style="border-color:var(--ac)"':'')+'><b>规划余量</b> · 粗表排到 ch'+esc(pm.coarse_to||'—')+' · 细拍排到 ch'+esc(pm.beats_to||'—')+' · 章骨排到 ch'+esc(pm.skeleton_to||'—')+'（可写余量 '+esc(pm.skeleton_left)+' 章'+(PLN.red?'，<span class="seat bad">告急</span>':'')+(PLN.halt_write?'，<span class="seat bad">已停写</span>':'')+'）';
plan+='<div class="mu">当前规划 '+esc(PLN.run||'—')+' · '+esc(PLN.stage||'—')+' · 第'+esc(PLN.round||'—')+'轮'+(PLN.needs_recheck?' · 待强模型复核':'')+'</div>';
if(PLN.pinned)plan+='<div><span class="tag t0">置顶·待作者勾选</span> 规划 '+esc(PLN.pinned.id)+'：'+esc(PLN.pinned.beats||'')+'</div>';
(PLN.alerts||[]).forEach(a=>plan+='<div class="seat bad">⚠ '+esc(a.t)+' '+esc(a.msg)+'</div>');
plan+='</div>';
document.getElementById('app').innerHTML=head+plan+table(focus,'今日焦点 ch16–24')+table(rest,'全书其余章节');
}</script><div id="gate"><form id="gf"><div>请输入阅读密码</div><input id="gp" type="password" autocomplete="current-password"><label style="font-size:14px"><input type="checkbox" id="gr"> 记住密码（仅本机）</label><br><button style="width:100%;margin-top:10px;background:var(--ac);color:#fff;border:0;padding:8px">打开</button><div id="gm" style="color:var(--ac);font-size:13px;margin-top:6px"></div></form></div>
