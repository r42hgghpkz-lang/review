    const anchor=e.target.closest('a[href^="#chapter-"]');
    if(anchor){e.preventDefault();jumpChapter(Number(anchor.getAttribute('href').split('-').pop()));}
  };
  document.getElementById('chapter-jump').onsubmit=e=>{e.preventDefault();jumpChapter(Number(document.getElementById('chapter-number').value));};
  document.getElementById('expand-groups').onclick=()=>app.querySelectorAll('details.group').forEach(el=>el.open=true);
  document.getElementById('refresh-latest').onclick=()=>{
    const url=new URL(location.href);url.searchParams.set('v',Date.now().toString(36));location.replace(url.href);
  };
  const chapterHash=location.hash.match(/^#chapter-(\d+)$/);
  if(chapterHash)jumpChapter(Number(chapterHash[1]));
}
