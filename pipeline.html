// 展开目标所在分组再定位；原生锚点无法显示折叠的历史行。
function jumpChapter(n){
  const target=document.getElementById('chapter-'+n),status=document.getElementById('nav-status');
  if(!target){if(status)status.textContent='本页未包含 ch'+n;return;}
  for(let parent=target.parentElement;parent;parent=parent.parentElement)if(parent.tagName==='DETAILS')parent.open=true;
