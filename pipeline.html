async function go(pw,rem){let X=await dec(pw);render(X);if(rem)localStorage.setItem('rv-pw',pw);document.getElementById('gate')?.remove();watchVersion()}
document.getElementById('gf').onsubmit=async e=>{e.preventDefault();let m=document.getElementById('gm'),button=e.currentTarget.querySelector('button');button.disabled=true;m.textContent='解密中…';try{await go(document.getElementById('gp').value,document.getElementById('gr').checked)}catch(x){m.textContent=x.name==='OperationError'?'密码不对':'页面加载失败，请刷新重试'}finally{button.disabled=false}};
document.getElementById('th').onclick=()=>{let r=document.documentElement,dk=r.dataset.theme?r.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dk?'light':'dark';localStorage.setItem('rv-theme',r.dataset.theme)};
(async()=>{let h=new URLSearchParams(location.hash.slice(1)).get('k');if(h){try{await go(h,1);history.replaceState(null,'',location.pathname+location.search);return}catch(e){}}let s=localStorage.getItem('rv-pw');if(s)try{await go(s,0)}catch(e){if(e.name==='OperationError')localStorage.removeItem('rv-pw')}})();
let versionTimer;
function watchVersion(){if(versionTimer)return;versionTimer=setInterval(checkVersion,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkVersion()})}
async function checkVersion(){
  if(document.hidden)return;
  try{const url=new URL(location.href);url.searchParams.set('v',Date.now().toString(36));url.hash='';
    const response=await fetch(url.href,{cache:'no-store'});if(!response.ok)return;
    const html=await response.text(),doc=new DOMParser().parseFromString(html,'text/html'),fresh=doc.querySelector('meta[name="pipeline-version"]');
    const freshTime=doc.querySelector('meta[name="pipeline-generated"]')?.content||'',currentTime=document.querySelector('meta[name="pipeline-generated"]').content;
    if(fresh&&freshTime>=currentTime&&fresh.content!==document.querySelector('meta[name="pipeline-version"]').content){
      const status=document.getElementById('nav-status');if(status)status.textContent='有新版，点击「刷新最新」更新';
      document.getElementById('refresh-latest')?.classList.add('new-version');
    }
  }catch(e){} // 网络短暂离线仍保留当前看板。
}
