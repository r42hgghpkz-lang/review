let versionTimer;
function watchVersion(){if(versionTimer)return;versionTimer=setInterval(checkVersion,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkVersion()})}
async function checkVersion(){
  if(document.hidden)return;
  try{const url=new URL(location.href);url.searchParams.set('v',Date.now().toString(36));url.hash='';
    const response=await fetch(url.href,{cache:'no-store'});if(!response.ok)return;
    const html=await response.text(),doc=new DOMParser().parseFromString(html,'text/html'),fresh=doc.querySelector('meta[name="pipeline-version"]');
    const freshTime=doc.querySelector('meta[name="pipeline-generated"]')?.content||'',currentTime=document.querySelector('meta[name="pipeline-generated"]').content;
    if(fresh&&freshTime>=currentTime&&fresh.content!==document.querySelector('meta[name="pipeline-version"]').content){
      const status=document.getElementById('nav-status');if(status)status.textContent='有新版，点击「刷新最新」更新';
      document.getElementById('refresh-latest')?.classList.add('new-version');
    }
  }catch(e){} // 网络短暂离线仍保留当前看板。
}
