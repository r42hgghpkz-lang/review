<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>审阅</title><style>*{box-sizing:border-box}:root{--bg:#faf8f3;--fg:#2b2b2b;--mu:#888;--ac:#c0392b;--card:#fff;--bd:#e6e0d4}@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1c1e;--fg:#d8d4cc;--mu:#888;--ac:#e0705f;--card:#242528;--bd:#34353a}}:root[data-theme=dark]{--bg:#1b1c1e;--fg:#d8d4cc;--mu:#888;--ac:#e0705f;--card:#242528;--bd:#34353a}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 "PingFang SC","Noto Sans CJK SC",sans-serif}header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;z-index:3}header b{flex:1}a{color:var(--ac)}
button{font:inherit;color:var(--fg);border:1px solid var(--bd);background:var(--card);border-radius:6px;padding:4px 10px;cursor:pointer}.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px;max-width:1300px;margin:auto}@media(max-width:860px){.cols{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:10px;display:block;text-decoration:none;color:var(--fg)}.card:hover{border-color:var(--ac)}.top{display:flex;gap:8px;align-items:center}.top b{flex:1}
.tag{font-size:12px;padding:1px 8px;border-radius:10px;color:#fff}.t0{background:#d35400}.t1{background:#2e8b57}.t2{background:#8e44ad}.sc{font-size:13px;color:var(--mu);margin-top:4px}.sc span{margin-right:8px}.sc i{font-style:normal;color:var(--fg)}
table{border-collapse:collapse;width:100%;max-width:1000px;margin:16px auto}td,th{border-bottom:1px solid var(--bd);padding:8px;text-align:left;vertical-align:top}h2{margin:4px 0 12px;font-size:18px}.wrap{max-width:1000px;margin:auto;padding:16px}.wrap section{margin-bottom:22px}.pin{border:2px solid var(--ac);border-radius:12px;padding:12px}.mu{color:var(--mu);font-size:13px;font-weight:normal}details.grp{margin:8px 0}details.grp summary{cursor:pointer;padding:6px 0}h3{font-size:15px;margin:10px 0 6px}.gt{margin:0}
#gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9}#gate form{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:20px;width:min(340px,90vw)}#gate input[type=password]{width:100%;font-size:16px;padding:8px;margin:8px 0;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg)}</style></head><body><header><b>审阅台</b><a href="index.html">首页</a><a href="pipeline.html">修仙看板</a><a href="log.html">记录</a><a href="seat-kpi.html">席位KPI</a><a href="shenming.html">神明(暂停)</a><button id="th">◐</button></header><div id="app"></div><script>function render(X){const ord={'待拍板':0,'待双检':0,'打回改中':1,'已拍板':2,'已锁定':2},cls={'待拍板':'t0','待双检':'t2','已锁定':'t1','已拍板':'t1','打回改中':'t2'};
const D=X.chapters||X,G=X.gates||[];const isDoc=x=>/决策|报告|规划|说明|账本|戏单|简介|大纲|邮件|番外/.test(x.ch);const pend=x=>x.status=='待拍板'||x.status=='待双检'||(x.wv||[]).some(w=>w.status=='待特批')||(x.polish||{}).state=='待作者审';
function card(x,showBook){let s=['设','行','商','美','读'].map(k=>'<span>'+k+'<i>'+esc((x.scores||{})[k]||'—')+'</i></span>').join('');
let pd=(x.decs||[]).filter(d=>{try{let o=JSON.parse(localStorage.getItem('rv:'+x.id+':'+x.fp+':dec')||'{}');let e=o[d.id];if(e==null)return true;if(typeof e==='string')return false;return!e.confirmed}catch(e){return true}}).length;
let decTip=x.ndec?(pd?(' · 待确认 '+pd+'/'+x.ndec):(' · 已确认 '+x.ndec+' 项')):'';
return '<a class="card" href="c/'+x.id+'.html"><div class="top"><b>'+(showBook?esc(x.book)+' · ':'')+esc(x.ch)+'</b><span class="tag '+(cls[x.status]||'')+'">'+esc(x.status)+'</span>'+(pd?'<span class="tag t0">待确认 '+pd+'</span>':'')+((x.polish||{}).state=='待作者审'?'<span class="tag t0">精校待审</span>':'')+(x.wv||[]).map(w=>'<span class="tag '+(w.status=='已批'?'t1':w.status=='拒'?'t2':'t0')+'" title="'+esc(w.src)+'">'+(w.status=='已批'?'特批·'+esc(w.gate):w.status=='拒'?'特批被拒·'+esc(w.gate):'待特批·'+esc(w.gate))+'</span>').join('')+'</div><div class="sc">'+s+'<span>朱雀<i>'+esc(x.zq)+'</i></span></div><div class="sc">'+esc(x.updated)+(x.ndiff?' · <b>改 '+x.ndiff+' 处</b>':'')+decTip+(x.note?' · '+esc(x.note):'')+'</div></a>'}
const fold=(t,n,body,open)=>body?'<details class="grp"'+(open?' open':'')+'><summary>'+t+' <span class="mu">（'+n+'）</span></summary>'+body+'</details>':'';
const list=L=>L.map(x=>card(x)).join('');
let P=D.filter(pend);let h='<div class="wrap"><section class="pin"><h2>待作者拍板 <span class="tag t0">'+P.length+'</span></h2>'+(P.length?P.map(x=>card(x,1)).join(''):'<div class="mu">暂无</div>')+'</section>';
h+='<section><h2>新书 · 同学录 <span class="mu">闸门①–⑥（文件在主编侧，审阅台只看进度）</span></h2><table class="gt"><tr><th>闸门</th><th>阶段</th><th>稿件</th><th>有效评审轮</th><th>作废</th><th>最新</th></tr>'+G.map(g=>'<tr><td>'+esc(g.n)+'</td><td>'+esc(g.name)+'</td><td>'+g.docs+'</td><td>'+g.rounds+'</td><td>'+g.voids+'</td><td>'+esc(g.latest||'—')+'</td></tr>').join('')+'</table></section>';
const BK={xiuqi:['修仙 · 修旧成仙',1,'<a href="pipeline.html">流水线看板</a> · <a href="log.html">拍板记录</a> · <a href="seat-kpi.html">席位KPI</a>'],xianzhi:['县志 · 重生1984',1,''],shenming:['神明 · 报错的夏天（已暂停）',0,'<a href="shenming.html">进度页</a>']};
let keys=[...new Set(D.map(x=>x.key))].sort((a,b)=>(BK[b]||[,0])[1]-(BK[a]||[,0])[1]);
keys.forEach(k=>{let L=D.filter(x=>x.key==k),meta=BK[k]||[L[0].book,1,''];let chs=L.filter(x=>!isDoc(x)&&!pend(x)),docs=L.filter(x=>isDoc(x)&&!pend(x));let act=chs.filter(x=>x.status!='已锁定'),lk=chs.filter(x=>x.status=='已锁定').reverse();
let body=(meta[2]?'<div class="sc">'+meta[2]+'</div>':'')+(act.length?'<h3>进行中</h3>'+list(act):'')+fold('章节审阅 · 已锁定',lk.length,list(lk),0)+fold('决策／规划／报告',docs.length,list(docs.reverse()),0);
h+=meta[1]?'<section><h2>'+esc(meta[0])+'</h2>'+body+'</section>':'<section>'+fold('<b>'+esc(meta[0])+'</b>',L.length,body,0)+'</section>'});
document.getElementById('app').innerHTML=h+'</div>';}</script><div id="gate"><form id="gf"><div>请输入阅读密码</div><input id="gp" type="password" autocomplete="current-password"><label style="font-size:14px"><input type="checkbox" id="gr"> 记住密码（仅本机）</label><br><button style="width:100%;margin-top:10px;background:var(--ac);color:#fff;border:0;padding:8px">打开</button><div id="gm" style="color:var(--ac);font-size:13px;margin-top:6px"></div></form></div>
