return '<a class="card" href="c/'+x.id+'.html"><div class="top"><b>'+(showBook?esc(x.book)+' · ':'')+esc(x.ch)+'</b><span class="tag '+(cls[x.status]||'')+'">'+esc(x.status)+'</span>'+(pd?'<span class="tag t0">待确认 '+pd+'</span>':'')+((x.polish||{}).state=='待作者审'?'<span class="tag t0">精校待审</span>':'')+(x.wv||[]).map(w=>'<span class="tag '+(w.status=='已批'?'t1':w.status=='拒'?'t2':'t0')+'" title="'+esc(w.src)+'">'+(w.status=='已批'?'特批·'+esc(w.gate):w.status=='拒'?'特批被拒·'+esc(w.gate):'待特批·'+esc(w.gate))+'</span>').join('')+'</div><div class="sc">'+s+'<span>朱雀<i>'+esc(x.zq)+'</i></span></div><div class="sc">'+esc(x.updated)+(x.ndiff?' · <b>改 '+x.ndiff+' 处</b>':'')+decTip+(x.note?' · '+esc(x.note):'')+'</div></a>'}
