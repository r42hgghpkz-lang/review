.tag{font-size:12px;padding:1px 8px;border-radius:10px;color:#fff}.t0{background:#d35400}.t1{background:#2e8b57}.t2{background:#8e44ad}.sc{font-size:13px;color:var(--mu);margin-top:4px}.sc span{margin-right:8px}.sc i{font-style:normal;color:var(--fg)}

const D=X.chapters||X,G=X.gates||[];const isDoc=x=>/决策|报告|规划|说明|账本|戏单|简介|大纲|邮件|番外/.test(x.ch);const pend=x=>x.status=='待拍板'||x.status=='待双检'||(x.wv||[]).some(w=>w.status=='待特批')||(x.polish||{}).state=='待作者审';
function card(x,showBook){let s=['设','行','商','美','读'].map(k=>'<span>'+k+'<i>'+esc((x.scores||{})[k]||'—')+'</i></span>').join('');
let pd=(x.decs||[]).filter(d=>{try{let o=JSON.parse(localStorage.getItem('rv:'+x.id+':'+x.fp+':dec')||'{}');let e=o[d.id];if(e==null)return true;if(typeof e==='string')return false;return!e.confirmed}catch(e){return true}}).length;
let decTip=x.ndec?(pd?(' · 待确认 '+pd+'/'+x.ndec):(' · 已确认 '+x.ndec+' 项')):'';
return '<a class="card" href="c/'+x.id+'.html"><div class="top"><b>'+(showBook?esc(x.book)+' · ':'')+esc(x.ch)+'</b><span class="tag '+(cls[x.status]||'')+'">'+esc(x.status)+'</span>'+(pd?'<span class="tag t0">待确认 '+pd+'</span>':'')+((x.polish||{}).state=='待作者审'?'<span class="tag t0">精校待审</span>':'')+(x.wv||[]).map(w=>'<span class="tag '+(w.status=='已批'?'t1':w.status=='拒'?'t2':'t0')+'" title="'+esc(w.src)+'">'+(w.status=='已批'?'特批·'+esc(w.gate):w.status=='拒'?'特批被拒·'+esc(w.gate):'待特批·'+esc(w.gate))+'</span>').join('')+'</div><div class="sc">'+s+'<span>朱雀<i>'+esc(x.zq)+'</i></span></div><div class="sc">'+esc(x.updated)+(x.ndiff?' · <b>改 '+x.ndiff+' 处</b>':'')+decTip+(x.note?' · '+esc(x.note):'')+'</div></a>'}
const fold=(t,n,body,open)=>body?'<details class="grp"'+(open?' open':'')+'><summary>'+t+' <span class="mu">（'+n+'）</span></summary>'+body+'</details>':'';
const list=L=>L.map(x=>card(x)).join('');
let P=D.filter(pend);let h='<div class="wrap"><section class="pin"><h2>待作者拍板 <span class="tag t0">'+P.length+'</span></h2>'+(P.length?P.map(x=>card(x,1)).join(''):'<div class="mu">暂无</div>')+'</section>';
let PC=X.pipes||[];if(PC.length){h+='<section id="ctl"><h2>流水线总控 <span class="mu">停＝不派新活，在跑那一步跑完即停；指令经加密 issue 回传，流水线约1分钟内收到</span></h2><table class="gt"><tr><th>线</th><th>开关</th><th>进程</th><th>上次活动</th><th>当前</th><th></th></tr>'+PC.map(p=>'<tr><td><b>'+esc(p.name)+'</b><div class="mu">'+esc(p.mech)+'</div></td><td><span class="tag '+(p.state=='stop'?'t2':'t1')+'">'+(p.state=='stop'?'已停':'运行中')+'</span><div class="mu">'+esc(p.updated)+' '+esc(p.by)+'</div></td><td>'+(p.proc?'在跑':'<span class="mu">未在跑</span>')+'</td><td>'+esc(p.last)+'</td><td>'+esc(p.step)+'</td><td><button data-l="'+esc(p.key)+'" data-s="'+(p.state=='stop'?'run':'stop')+'">'+(p.state=='stop'?'启动':'停止')+'</button><div class="mu" id="pc-'+esc(p.key)+'"></div></td></tr>').join('')+'</table></section>'}
h+='<section><h2>新书 · 同学录 <span class="mu">闸门①–⑥（文件在主编侧，审阅台只看进度）</span></h2><table class="gt"><tr><th>闸门</th><th>阶段</th><th>稿件</th><th>有效评审轮</th><th>作废</th><th>最新</th></tr>'+G.map(g=>'<tr><td>'+esc(g.n)+'</td><td>'+esc(g.name)+'</td><td>'+g.docs+'</td><td>'+g.rounds+'</td><td>'+g.voids+'</td><td>'+esc(g.latest||'—')+'</td></tr>').join('')+'</table></section>';

document.getElementById('app').innerHTML=h+'</div>';
const u2b=u=>btoa(String.fromCharCode(...u));async function encT(t){let s=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),k=await crypto.subtle.importKey('raw',new TextEncoder().encode(window.PW),'PBKDF2',false,['deriveKey']);k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:600000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt']);let c=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(t))),o=new Uint8Array(28+c.length);o.set(s);o.set(iv,16);o.set(c,28);return u2b(o)}
