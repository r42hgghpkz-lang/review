const D=X.chapters||X,G=X.gates||[];const isDoc=x=>/决策|报告|规划|说明|账本|戏单|简介|大纲|邮件|番外/.test(x.ch);const pend=x=>x.status=='待拍板'||x.status=='待双检'||(x.wv||[]).some(w=>w.status=='待特批')||(x.polish||{}).state=='待作者审';
function card(x,showBook){let s=['设','行','商','美','读'].map(k=>'<span>'+k+'<i>'+esc((x.scores||{})[k]||'—')+'</i></span>').join('');
let pd=(x.decs||[]).filter(d=>{try{let o=JSON.parse(localStorage.getItem('rv:'+x.id+':'+x.fp+':dec')||'{}');let e=o[d.id];if(e==null)return true;if(typeof e==='string')return false;return!e.confirmed}catch(e){return true}}).length;
let decTip=x.ndec?(pd?(' · 待确认 '+pd+'/'+x.ndec):(' · 已确认 '+x.ndec+' 项')):'';
return '<a class="card" href="c/'+x.id+'.html"><div class="top"><b>'+(showBook?esc(x.book)+' · ':'')+esc(x.ch)+'</b><span class="tag '+(cls[x.status]||'')+'">'+esc(x.status)+'</span>'+(pd?'<span class="tag t0">待确认 '+pd+'</span>':'')+((x.polish||{}).state=='待作者审'?'<span class="tag t0">精校待审</span>':'')+(x.wv||[]).map(w=>'<span class="tag '+(w.status=='已批'?'t1':w.status=='拒'?'t2':'t0')+'" title="'+esc(w.src)+'">'+(w.status=='已批'?'特批·'+esc(w.gate):w.status=='拒'?'特批被拒·'+esc(w.gate):'待特批·'+esc(w.gate))+'</span>').join('')+'</div><div class="sc">'+s+'<span>朱雀<i>'+esc(x.zq)+'</i></span></div><div class="sc">'+esc(x.updated)+(x.ndiff?' · <b>改 '+x.ndiff+' 处</b>':'')+decTip+(x.note?' · '+esc(x.note):'')+'</div></a>'}
const fold=(t,n,body,open)=>body?'<details class="grp"'+(open?' open':'')+'><summary>'+t+' <span class="mu">（'+n+'）</span></summary>'+body+'</details>':'';
const list=L=>L.map(x=>card(x)).join('');
let P=D.filter(pend),NP=X.nbpend||[];let h='<div class="wrap"><section class="pin"><h2>待作者拍板 <span class="tag t0">'+(P.length+NP.length)+'</span></h2>'+NP.map(x=>'<div class="card"><div class="top"><b>'+esc(x.book)+' · '+esc(x.gate_name)+'</b><span class="tag t0">'+esc(x.kind)+'</span></div><div class="sc">'+esc(x.time)+' · '+esc(typeof x.detail=='string'?x.detail:JSON.stringify(x.detail))+'</div></div>').join('')+(P.length?P.map(x=>card(x,1)).join(''):(NP.length?'':'<div class="mu">暂无</div>'))+'</section>';
let PC=X.pipes||[];if(PC.length){h+='<section id="ctl"><h2>流水线总控 <span class="mu">停＝不派新活，在跑那一步跑完即停；指令经加密 issue 回传，流水线约1分钟内收到</span></h2><table class="gt"><tr><th>线</th><th>开关</th><th>进程</th><th>上次活动</th><th>当前</th><th></th></tr>'+PC.map(p=>'<tr><td><b>'+esc(p.name)+'</b><div class="mu">'+esc(p.mech)+'</div></td><td><span class="tag '+(p.state=='stop'?'t2':'t1')+'">'+(p.state=='stop'?'已停':'运行中')+'</span><div class="mu">'+esc(p.updated)+' '+esc(p.by)+'</div></td><td>'+(p.proc?'在跑':'<span class="mu">未在跑</span>')+'</td><td>'+esc(p.last)+'</td><td>'+esc(p.step)+'</td><td><button data-l="'+esc(p.key)+'" data-s="'+(p.state=='stop'?'run':'stop')+'">'+(p.state=='stop'?'启动':'停止')+'</button><div class="mu" id="pc-'+esc(p.key)+'"></div></td></tr>').join('')+'</table></section>'}
h+='<section><h2>新书 · 同学录 <span class="mu">闸门①–⑥（文件在主编侧，审阅台只看进度）</span></h2><table class="gt"><tr><th>闸门</th><th>阶段</th><th>过线</th><th>稿件</th><th>有效评审轮</th><th>作废</th><th>最新</th></tr>'+G.map(g=>'<tr><td>'+esc(g.n)+'</td><td>'+esc(g.name)+'</td><td>'+esc(g.pass||'—')+'</td><td>'+g.docs+'</td><td>'+g.rounds+'</td><td>'+g.voids+'</td><td>'+esc(g.latest||'—')+'</td></tr>').join('')+'</table></section>';
const BK={xiuqi:['修仙 · 修旧成仙',1,'<a href="pipeline.html">流水线看板</a> · <a href="log.html">拍板记录</a> · <a href="seat-kpi.html">席位KPI</a>'],xianzhi:['县志 · 重生1984',1,''],shenming:['神明 · 报错的夏天（已暂停）',0,'<a href="shenming.html">进度页</a>']};

h+=meta[1]?'<section><h2>'+esc(meta[0])+'</h2>'+body+'</section>':'<section>'+fold('<b>'+esc(meta[0])+'</b>',L.length,body,0)+'</section>'});
document.getElementById('app').innerHTML=h+'</div>';
const u2b=u=>btoa(String.fromCharCode(...u));async function encT(t){let s=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),k=await crypto.subtle.importKey('raw',new TextEncoder().encode(window.PW),'PBKDF2',false,['deriveKey']);k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:600000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt']);let c=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(t))),o=new Uint8Array(28+c.length);o.set(s);o.set(iv,16);o.set(c,28);return u2b(o)}
document.querySelectorAll('#ctl button[data-l]').forEach(b=>b.onclick=async()=>{let l=b.dataset.l,v=b.dataset.s,m=document.getElementById('pc-'+l),nm=(PC.find(p=>p.key==l)||{}).name;if(!confirm('确认'+(v=='stop'?'停止':'启动')+'「'+nm+'」？'+(v=='stop'?'\n在跑那一步会跑完再停。':'')))return;b.disabled=true;m.textContent='加密中…';
let body=await encT(JSON.stringify({v:1,action:'流水线起停',line:l,state:v,time:new Date().toISOString()})),title='起停+'+Math.random().toString(36).slice(2,8);
try{if(X.issueTok){let r=await fetch('https://api.github.com/repos/r42hgghpkz-lang/review/issues',{method:'POST',headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+X.issueTok,'Content-Type':'application/json'},body:JSON.stringify({title,body})});if(!r.ok)throw new Error('HTTP '+r.status);let j=await r.json();m.textContent='✓ 已提交 #'+j.number+'，约1分钟生效，刷新看状态';return}}catch(e){m.textContent='直接提交失败，改用 GitHub 页面：'+e.message}
let u='https://github.com/r42hgghpkz-lang/review/issues/new?title='+encodeURIComponent(title)+'&body='+encodeURIComponent(body);window.open(u,'_blank')||(location.href=u);m.textContent='已打开 GitHub，点 Submit 提交';b.disabled=false});}</script><div id="gate"><form id="gf"><div>请输入阅读密码</div><input id="gp" type="password" autocomplete="current-password"><label style="font-size:14px"><input type="checkbox" id="gr"> 记住密码（仅本机）</label><br><button style="width:100%;margin-top:10px;background:var(--ac);color:#fff;border:0;padding:8px">打开</button><div id="gm" style="color:var(--ac);font-size:13px;margin-top:6px"></div></form></div>
