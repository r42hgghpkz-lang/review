<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>审阅</title>
<style>body{max-width:600px;margin:auto;padding:24px;font:17px/1.8 sans-serif;background:#faf8f3;color:#2b2b2b}a{color:#c0392b}input,button{font-size:16px;padding:6px}@media(prefers-color-scheme:dark){body{background:#1b1c1e;color:#d8d4cc}a{color:#e0705f}}</style></head><body>
<form id="f"><p>请输入阅读密码</p><input id="p" type="password"> <button>打开</button> <label><input type="checkbox" id="r">记住密码</label><p id="m"></p></form><div id="l"></div>
<script>const ENC="IUZ7oQndz2GoifMwP3niDc9V68ivlFtPR3d3W85rV3H8Zz4V6n5Tfbl4G7NXjk9mbHaFhoA3pUIGHNy8Ff525/NaVJ9Tt50P55v0jl1kBZuds1gTjrTAuqL5YwOSLcEbMkPH0RzRGeJg+s6NhI/FGBZgZGGe75LaiLw5vhadpHliOOqrOgxH";const b2u=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function dec(pw){let r=b2u(ENC),k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:r.slice(0,16),iterations:600000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:r.slice(16,28)},k,r.slice(28))))}
async function go(pw,rem){let L=await dec(pw);if(rem)localStorage.setItem('rv-pw',pw);f.remove();let g={};L.forEach(x=>(g[x.book]=g[x.book]||[]).push(x));
for(let b in g){let h=document.createElement('h2');h.textContent=b;l.append(h);let u=document.createElement('ul');g[b].forEach(x=>{let li=document.createElement('li'),a=document.createElement('a');a.href='c/'+x.id+'.html';a.textContent=x.title;li.append(a);u.append(li)});l.append(u)}}
f.onsubmit=async e=>{e.preventDefault();m.textContent='解密中…';try{await go(p.value,r.checked)}catch(x){m.textContent='密码不对'}};
(async()=>{let h=new URLSearchParams(location.hash.slice(1)).get('k');if(h){try{await unlock(h,true);history.replaceState(null,'',location.pathname+location.search);return}catch(e){}}let s=localStorage.getItem('rv-pw');if(s)try{await go(s,0)}catch(e){}})();</script></body></html>
