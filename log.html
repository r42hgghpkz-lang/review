async function go(pw,rem){let X=await dec(pw);if(rem)localStorage.setItem('rv-pw',pw);document.getElementById('gate').remove();render(X)}
document.getElementById('gf').onsubmit=async e=>{e.preventDefault();let m=document.getElementById('gm');m.textContent='解密中…';try{await go(document.getElementById('gp').value,document.getElementById('gr').checked)}catch(x){m.textContent='密码不对'}};
document.getElementById('th').onclick=()=>{let r=document.documentElement,dk=r.dataset.theme?r.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dk?'light':'dark';localStorage.setItem('rv-theme',r.dataset.theme)};
(async()=>{let h=new URLSearchParams(location.hash.slice(1)).get('k');if(h){try{await go(h,1);history.replaceState(null,'',location.pathname);return}catch(e){}}let s=localStorage.getItem('rv-pw');if(s)try{await go(s,0)}catch(e){localStorage.removeItem('rv-pw')}})();</script></body></html>
