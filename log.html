";const b2u=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function dec(pw){let r=b2u(ENC),k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:r.slice(0,16),iterations:600000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:r.slice(16,28)},k,r.slice(28))))}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function go(pw,rem){let X=await dec(pw);if(rem)localStorage.setItem('rv-pw',pw);document.getElementById('gate').remove();render(X)}

(async()=>{let h=new URLSearchParams(location.hash.slice(1)).get('k');if(h){try{await go(h,1);history.replaceState(null,'',location.pathname);return}catch(e){}}let s=localStorage.getItem('rv-pw');if(s)try{await go(s,0)}catch(e){localStorage.removeItem('rv-pw')}})();</script></body></html>
