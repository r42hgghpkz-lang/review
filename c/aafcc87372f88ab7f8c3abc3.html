<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>结构审阅</title><meta name="robots" content="noindex">
<script>(function(){var d=document.documentElement,m=localStorage.getItem('rv-theme');if(m)d.dataset.theme=m})()</script>
<style>
:root{--bg:#faf8f3;--fg:#2b2b2b;--mu:#888;--ac:#c0392b;--card:#fff;--bd:#e6e0d4;--hd:#fffdf8ee;--g:#2e8b57;--y:#d35400;--r:#c0392b;--hl:#fff1b8;--hv:#f1ece2}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1c1e;--fg:#d8d4cc;--mu:#777;--ac:#e0705f;--card:#242528;--bd:#34353a;--hd:#1b1c1eee;--hl:#4a4020;--hv:#26272a}}
:root[data-theme=dark]{--bg:#1b1c1e;--fg:#d8d4cc;--mu:#777;--ac:#e0705f;--card:#242528;--bd:#34353a;--hd:#1b1c1eee;--hl:#4a4020;--hv:#26272a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.65 "PingFang SC","Noto Sans CJK SC",sans-serif}
header{position:sticky;top:0;background:var(--hd);border-bottom:1px solid var(--bd);padding:8px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;z-index:5}
header b{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}#st{font-size:12px;color:var(--fg)}#meta{color:var(--mu);font-size:12px}
button{font:inherit;color:var(--fg);border:1px solid var(--bd);background:var(--card);border-radius:6px;padding:6px 12px;cursor:pointer;min-height:40px}
button:disabled{opacity:.45;cursor:not-allowed}.big{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
a{color:var(--ac)}.wrap{max-width:920px;margin:0 auto;padding:14px 16px 120px}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.verdict{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.tag{font-size:12px;padding:2px 9px;border-radius:10px;color:#fff;background:var(--y)}.tag.ok{background:var(--g)}.tag.bad{background:var(--r)}.tag.mu{background:#7f8c8d}
.lamps{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.lamp{border:1px solid var(--bd);border-radius:8px;padding:6px 8px;min-width:72px;text-align:center;cursor:pointer;background:var(--bg)}
.lamp:hover,.lamp.on{border-color:var(--ac)}.lamp .n{font-size:12px;color:var(--mu)}.lamp .v{font-weight:700;font-size:16px}
.lamp.绿 .v{color:var(--g)}.lamp.黄 .v{color:var(--y)}.lamp.红 .v{color:var(--r)}
.lamp .d{font-size:11px;color:var(--mu);margin-top:2px}
.issue{border-left:3px solid var(--y);padding:8px 10px;margin:8px 0;background:var(--bg);border-radius:0 8px 8px 0;cursor:pointer}
.issue.红{border-left-color:var(--r)}.issue.on{outline:2px solid var(--ac)}.issue .h{font-size:12px;color:var(--ac);margin-bottom:4px}
.issue .t{font-size:14px;line-height:1.55}
.vers{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px;font-size:13px}
.vers a,.vers span{padding:4px 10px;border-radius:8px;border:1px solid var(--bd);text-decoration:none;color:var(--fg);background:var(--card)}
.vers .cur{border-color:var(--ac);color:var(--ac);font-weight:600}
details.sec{border:1px solid var(--bd);border-radius:8px;margin:8px 0;background:var(--card)}
details.sec>summary{cursor:pointer;padding:10px 12px;font-weight:600;list-style:none;display:flex;gap:8px;align-items:center}
details.sec>summary::-webkit-details-marker{display:none}
details.sec .body{padding:0 12px 12px;white-space:pre-wrap;font:14.5px/1.7 "Noto Serif CJK SC","Source Han Serif SC",serif;overflow-wrap:anywhere}
details.sec.hot{border-color:var(--ac)}details.sec .sid{font-size:12px;color:var(--mu);font-weight:500}
details.sec .act{margin-left:auto;font-size:12px;font-weight:500;color:var(--ac);border:1px solid var(--bd);border-radius:6px;padding:2px 8px;background:var(--bg)}
.hint{color:var(--mu);font-size:13px;margin:6px 0 12px}
#ed{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(560px,94vw);background:var(--card);border:1px solid var(--bd);border-radius:10px;box-shadow:0 6px 24px #0004;padding:10px;display:none;z-index:9}
#ed textarea{width:100%;height:88px;font:15px/1.5 sans-serif;border:1px solid var(--bd);background:var(--bg);color:var(--fg);border-radius:6px;padding:6px}
#ed .q{color:var(--mu);font-size:13px;max-height:3em;overflow:hidden;margin-bottom:6px}
aside#sd{position:fixed;right:0;top:52px;bottom:0;width:min(320px,92vw);border-left:1px solid var(--bd);background:var(--bg);padding:12px;overflow:auto;display:none;z-index:6}
aside#sd.open{display:block}.c{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px;margin-bottom:10px}.c .q{color:var(--mu);border-left:3px solid var(--ac);padding-left:6px;margin:4px 0;font-size:12px}.c .h{color:var(--ac);font-size:12px;cursor:pointer}
#cbx{position:fixed;inset:20% 5% auto;height:50%;z-index:20;display:none;width:90%;font:14px/1.5 sans-serif;background:var(--card);color:var(--fg);border:2px solid var(--ac);border-radius:8px;padding:8px}
#gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center}
#gate form{width:min(340px,90vw);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:20px}
#gate input[type=password]{width:100%;font-size:16px;padding:8px;margin:8px 0;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg)}
@media(max-width:700px){header{padding:8px}.wrap{padding:10px 10px 130px}button.big{padding:6px 10px}}
</style></head><body>
<header>
  <a href="../index.html" style="text-decoration:none;color:var(--mu)">← 目录</a>
  <b id="hdt">结构审阅</b>
  <span id="meta"></span>
  <span id="st"></span>
  <button id="rj" class="big">打回</button>
  <button id="sub">提交批注</button>
  <button id="cp">复制全部批注</button>
  <button id="tg">批注</button>
  <button id="th" title="浅色/深色">◐</button>
</header>
<div class="wrap" id="app"></div>
<aside id="sd"></aside>
<div id="ed"><div class="q" id="eq"></div><textarea id="et" placeholder="写批注…（Ctrl+Enter 保存）"></textarea><div style="text-align:right;margin-top:6px"><button id="ec">取消</button> <button id="es" style="background:var(--ac);color:#fff;border-color:var(--ac)">保存</button></div></div>
<textarea id="cbx" readonly></textarea>
<div id="gate"><form id="gf"><div>请输入阅读密码</div><input id="gp" type="password" autocomplete="current-password"><label style="font-size:14px;display:block;margin:8px 0"><input type="checkbox" id="gr"> 记住密码（仅本机）</label><button style="width:100%;background:var(--ac);color:#fff;border:0;padding:8px;border-radius:6px">打开</button><div id="gm" style="color:var(--ac);font-size:13px;margin-top:6px"></div></form></div>

const b2u=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0)),u2b=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
async function dk(pw,salt){let k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function decText(pw,b){let r=b2u(b);return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:r.slice(16,28)},await dk(pw,r.slice(0,16)),r.slice(28)))}

const $=id=>document.getElementById(id),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function nkey(){return 'rv:'+FID+':'+((P&&P.fp)||'')+':notes'}
function loadA(){try{A=JSON.parse(localStorage.getItem(nkey())||'[]')}catch(e){A=[]}}
function saveA(){localStorage.setItem(nkey(),JSON.stringify(A));paintNotes()}
function paintNotes(){let sd=$('sd');sd.innerHTML=A.length?'':'<div class="hint">点灯／问题卡／结构段写批注；写完点「提交批注」或「打回」。本页无「确认开细纲」，禁代签。</div>';
A.forEach((x,i)=>{let d=document.createElement('div');d.className='c';d.innerHTML='<div class="h">段位 '+esc(x.n)+(x.qid?' · '+esc(x.qid):'')+' · 删</div><div class="q">'+esc(x.q||'')+'</div><div>'+esc(x.c)+'</div>';d.querySelector('.h').onclick=()=>{A.splice(i,1);saveA()};sd.append(d)});$('st').textContent=A.length?('批注 '+A.length+' 条'):''}
function openEd(seg,qid,quote){curSeg=String(seg||'');curQ=qid||'';$('eq').textContent=(qid?qid+' · ':'')+'段位 '+curSeg+(quote?('｜'+quote.slice(0,80)):'' );$('et').value='';$('ed').style.display='block';$('et').focus()}
$('ec').onclick=()=>$('ed').style.display='none';
$('es').onclick=()=>{let c=$('et').value.trim();if(!c){alert('请写批注');return}A.push({n:curSeg||'?',q:$('eq').textContent,c,t:Date.now(),qid:curQ||''});saveA();$('ed').style.display='none'};
$('et').onkeydown=e=>{if(e.ctrlKey&&e.key==='Enter')$('es').click()};
let submitting=false;
async function postIssue(title,body){const tok=(P&&P.issueTok)||'';if(!tok)return null;
try{let r=await fetch('https://api.github.com/repos/r42hgghpkz-lang/review/issues',{method:'POST',headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify({title,body})});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}catch(e){return {error:String(e)}}}
async function submit(action){if(submitting)return;if(action=='打回'&&!A.length){alert('打回请先写批注。');return}
if(action=='批注'&&!A.length){$('st').textContent='还没有批注';return}
if(action=='打回'&&!confirm('确认打回？共 '+A.length+' 条批注会提交。结构正文不会被本页改掉。'))return;
submitting=true;$('st').textContent='加密中…';
let payload={v:1,action,book:P.book,ch:P.ch,kind:'structure',fid:FID,fp:P.fp,sha:P.sha||'',time:new Date().toISOString(),notes:A.map(x=>({n:x.n,q:x.q,c:x.c,t:x.t,qid:x.qid||''})),decisions:P.decisions||[]};
let title=(action=='批注'?'批注+':'审阅+')+Math.random().toString(36).slice(2,8),body;
try{body=await encText(JSON.stringify(payload))}catch(e){$('st').textContent='加密失败';submitting=false;return}
let direct=await postIssue(title,body);
if(direct&&direct.number){$('st').textContent='已提交 #'+direct.number;submitting=false;return}
if(direct&&direct.error)$('st').textContent='直接提交失败，改用 GitHub：'+direct.error;
let u='https://github.com/r42hgghpkz-lang/review/issues/new?title='+encodeURIComponent(title)+'&body='+encodeURIComponent(body);
if(u.length<=7000){window.open(u,'_blank')||(location.href=u);$('st').textContent='已打开 GitHub，点 Submit 提交'}
else{$('cbx').value=body;$('cbx').style.display='block';$('cbx').select();window.open('https://github.com/r42hgghpkz-lang/review/issues/new?title='+encodeURIComponent(title),'_blank');$('st').textContent='密文已复制框内，请粘贴到 issue 正文'}
submitting=false}
$('sub').onclick=()=>submit('批注');$('rj').onclick=()=>submit('打回');
$('cp').onclick=()=>{let t=A.map(x=>'【'+x.n+(x.qid?'/'+x.qid:'')+'】'+x.c).join('\n\n');$('cbx').value=t;$('cbx').style.display='block';$('cbx').select();try{navigator.clipboard.writeText(t)}catch(e){}};
$('tg').onclick=()=>$('sd').classList.toggle('open');
$('th').onclick=()=>{let r=document.documentElement,dk=r.dataset.theme?r.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dk?'light':'dark';localStorage.setItem('rv-theme',r.dataset.theme)};
$('cbx').onblur=()=>$('cbx').style.display='none';

function render(){
  const C=P.coldread||{},lamps=C.lamps||[],issues=C.issues||[],secs=P.sections||[];
  let vtag=C.verdict==='过'?'ok':(C.verdict?'bad':'mu');
  let h='';
  // versions
  let vers=P.versions||[];
  if(vers.length||P.diffFrom){
    h+='<div class="vers"><span class="mu">历史版本</span>';
    vers.forEach(v=>{
      if(v.current) h+='<span class="cur">'+esc(v.label||v.ch)+'</span>';
      else if(v.href) h+='<a href="'+esc(v.href)+'">'+esc(v.label||v.ch)+'</a>';
      else h+='<span>'+esc(v.label||v.ch)+'</span>';
    });
    if(P.diffFrom) h+='<span class="mu">'+esc(P.diffFrom)+'</span>';
    h+='</div>';
  }
  h+='<div class="panel"><div class="verdict"><b>取严结论</b>';
  h+='<span class="tag '+vtag+'">'+esc(C.verdict||'无')+'</span>';
  h+='<span class="tag mu">签约 '+esc(C.sign||'—')+'</span>';
  h+='<span class="tag mu">追读 '+esc(C.follow||'—')+'</span>';
  if(C.gptPass!=null) h+='<span class="tag '+(C.gptPass?'ok':'bad')+'">GPT '+(C.gptPass?'过':'不过')+'</span>';
  if(C.grokPass!=null) h+='<span class="tag '+(C.grokPass?'ok':'bad')+'">Grok '+(C.grokPass?'过':'不过')+'</span>';
  h+='</div><div class="hint">'+esc(C.note||'')+(C.source?(' · 来源 '+C.source):'')+' · 指纹 '+esc(P.fp)+' · 状态 '+esc(P.status||'')+'</div>';
  h+='<div><b>灯表</b>（取严；点段写批）</div><div class="lamps">';
  lamps.forEach(L=>{h+='<div class="lamp '+esc(L.lamp)+'" data-seg="'+esc(L.id)+'"><div class="n">'+esc(L.label||L.id)+'</div><div class="v">'+esc(L.lamp)+'</div><div class="d">'+esc(L.delta||'')+'</div></div>'});
  h+='</div></div>';
  h+='<div class="panel"><b>黄／红问题</b><div class="hint">点卡片写批注；批完团队再动 STRUCTURE，本页不改正文、不代签。</div>';
  let bad=issues.filter(x=>x.lamp==='红'||x.lamp==='黄');
  (bad.length?bad:issues).forEach(Q=>{h+='<div class="issue '+esc(Q.lamp||'')+'" data-seg="'+esc(Q.seg||'')+'" data-qid="'+esc(Q.id||'')+'"><div class="h">'+esc(Q.id||'')+' · 段位 '+esc(Q.seg||'?')+' · '+esc(Q.lamp||'')+'</div><div class="t">'+esc(Q.text||'')+'</div></div>'});
  if(!issues.length) h+='<div class="hint">无问题卡（冷读包空或未挂）</div>';
  h+='</div>';
  h+='<div class="panel"><b>结构正文</b><div class="hint">按标题分段，可展开；黄红段默认展开。点「批」按段批注。</div>';
  const hot=new Set((lamps.filter(x=>x.lamp==='黄'||x.lamp==='红').map(x=>String(x.id))).concat(issues.map(x=>String(x.seg||''))));
  secs.forEach(S=>{
    let open=hot.has(String(S.id)) || /^(3a|3b|3c|3|5)$/.test(String(S.id));
    h+='<details class="sec'+(hot.has(String(S.id))?' hot':'')+'" '+(open?'open':'')+' data-seg="'+esc(S.id)+'"><summary><span class="sid">'+esc(S.id)+'</span> '+esc(S.label||'')+' <span class="act" data-bat="1">批</span></summary><div class="body">'+esc(S.text||'')+'</div></details>';
  });
  h+='</div>';
  // prev hist preview
  if(P.hist&&Object.keys(P.hist).length){
    h+='<div class="panel"><details><summary><b>上一版正文对照</b>（'+esc(P.diffFrom||'prev')+'）</summary>';
    Object.keys(P.hist).forEach(fp=>{
      let arr=P.hist[fp]||[];
      h+='<div class="hint">指纹 '+esc(fp)+' · '+arr.length+' 块</div>';
      arr.slice(0,8).forEach((t,i)=>{h+='<details class="sec"><summary>块 '+(i+1)+'</summary><div class="body">'+esc(t).slice(0,4000)+'</div></details>'});
    });
    h+='</details></div>';
  }
  $('app').innerHTML=h;
  document.querySelectorAll('.lamp').forEach(el=>el.onclick=()=>openEd(el.dataset.seg,'','灯 '+el.dataset.seg));
  document.querySelectorAll('.issue').forEach(el=>el.onclick=()=>openEd(el.dataset.seg,el.dataset.qid,el.querySelector('.t').textContent));
  document.querySelectorAll('details.sec .act').forEach(el=>el.onclick=e=>{e.preventDefault();e.stopPropagation();openEd(el.closest('details').dataset.seg,'','结构段')});
  $('meta').textContent=(P.status||'')+' · 指纹 '+P.fp;
  paintNotes();
}
async function unlock(pw,remember){P=JSON.parse(await decText(pw,ENC));PW=pw;if(remember)localStorage.setItem('rv-pw',pw);$('gate').remove();
document.title=(P.book||'')+'·'+(P.ch||'结构');$('hdt').textContent=(P.book||'')+' · '+(P.ch||'结构');loadA();render()}
$('gf').onsubmit=async e=>{e.preventDefault();let m=$('gm');if(!window.crypto||!crypto.subtle){m.textContent='浏览器不支持解密（需 https）';return}m.textContent='解密中…';
try{await unlock($('gp').value,$('gr').checked)}catch(x){m.textContent='密码不对'}};
(async()=>{let h=new URLSearchParams(location.hash.slice(1)).get('k');if(h){try{await unlock(h,true);history.replaceState(null,'',location.pathname+location.search);return}catch(e){}}let s=localStorage.getItem('rv-pw');if(s){try{await unlock(s,true)}catch(e){localStorage.removeItem('rv-pw')}}})();
