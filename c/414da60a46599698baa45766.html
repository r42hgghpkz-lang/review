<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>审阅</title><meta name="robots" content="noindex">
<script>(function(){var m=localStorage.getItem('rv-theme');if(m)document.documentElement.dataset.theme=m})()</script><style>
:root{--bg:#faf8f3;--fg:#2b2b2b;--mu:#999;--ac:#c0392b;--hl:#fff1b8;--hv:#f1ece2;--card:#fff;--bd:#e6e0d4;--hd:#fffdf8ee;--chg:#e6f3ef;--chg-bd:#2a9d8f}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1c1e;--fg:#d8d4cc;--mu:#777;--ac:#e0705f;--hl:#4a4020;--hv:#26272a;--card:#242528;--bd:#34353a;--hd:#1b1c1eee;--chg:#1e2e2a;--chg-bd:#3dbdae}}
:root[data-theme=dark]{--bg:#1b1c1e;--fg:#d8d4cc;--mu:#777;--ac:#e0705f;--hl:#4a4020;--hv:#26272a;--card:#242528;--bd:#34353a;--hd:#1b1c1eee;--chg:#1e2e2a;--chg-bd:#3dbdae}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:"PingFang SC","Noto Serif CJK SC","Source Han Serif SC","Songti SC",serif}
header{position:sticky;top:0;background:var(--hd);border-bottom:1px solid var(--bd);padding:8px 16px;display:flex;gap:8px;align-items:center;z-index:5;font-family:sans-serif;font-size:14px}
header b{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}#st{color:var(--mu);font-size:12px}
button{font:inherit;color:var(--fg);border:1px solid var(--bd);background:var(--card);border-radius:6px;padding:4px 10px;cursor:pointer}
.wrap{display:flex;max-width:1200px;margin:auto}main{flex:1;max-width:760px;margin:auto;padding:24px 20px 140px}
p{position:relative;font-size:18px;line-height:1.95;margin:0 0 .9em;text-indent:2em;text-align:justify;padding:2px 6px;border-radius:4px}
p:hover{background:var(--hv)}p.has{background:var(--hl)}p.chg{background:var(--chg);box-shadow:inset 3px 0 0 var(--chg-bd)}p.chg.has{background:var(--hl);box-shadow:inset 3px 0 0 var(--chg-bd)}p.chg-focus{outline:2px solid var(--chg-bd)}p.sel{outline:2px solid var(--ac)}
p .n{position:absolute;left:-2.4em;top:.35em;text-indent:0;font:12px/1 sans-serif;color:var(--mu);width:2em;text-align:right;user-select:none}p .chg-badge{position:absolute;left:-3.6em;top:1.6em;text-indent:0;font:10px/1 sans-serif;color:#fff;background:var(--chg-bd);border-radius:3px;padding:2px 3px;user-select:none}
aside{width:340px;border-left:1px solid var(--bd);height:calc(100vh - 45px);position:sticky;top:45px;overflow:auto;padding:12px;font-family:sans-serif;font-size:14px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px;margin-bottom:10px}.c .q{color:var(--mu);border-left:3px solid var(--ac);padding-left:6px;margin:4px 0}.c .h{color:var(--ac);font-size:12px;cursor:pointer}
#ed{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(560px,94vw);background:var(--card);border:1px solid var(--bd);border-radius:10px;box-shadow:0 6px 24px #0004;padding:10px;display:none;z-index:9;font-family:sans-serif}
#ed textarea{width:100%;height:80px;font:15px/1.5 sans-serif;border:1px solid var(--bd);background:var(--bg);color:var(--fg);border-radius:6px;padding:6px}#ed .q{color:var(--mu);font-size:13px;max-height:3em;overflow:hidden;margin-bottom:6px}
#fb{position:fixed;display:none;z-index:8;background:var(--ac);color:#fff;border:0;padding:8px 16px;border-radius:20px;box-shadow:0 3px 10px #0004;font-family:sans-serif}
#tg{display:none}#df{max-width:760px;margin:16px auto 0;padding:0 20px;font-family:sans-serif;font-size:14px}#df details{border:1px solid var(--bd);border-radius:8px;padding:8px 12px;background:var(--card)}#df .pr{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0;border-top:1px dashed var(--bd);padding-top:8px}#df .b4{color:var(--mu);text-decoration:line-through;text-decoration-color:#c0392b80}#df .af{color:var(--fg)}#df .mt{color:var(--mu);font-size:12px}@media(max-width:600px){#df .pr{grid-template-columns:1fr}}#meta{color:var(--mu);font-size:12px}.big{background:var(--ac);color:#fff;border-color:var(--ac);font-size:15px;padding:7px 16px;font-weight:600}
.dec{margin:0 0 1.1em;padding:10px 12px;border:1px dashed var(--ac);border-radius:8px;background:var(--card);font-family:sans-serif;font-size:14px;text-indent:0;text-align:left}
.dec .dec-lab{color:var(--ac);font-weight:600;margin-bottom:6px;font-size:13px}
.dec .dec-opts{display:flex;flex-wrap:wrap;gap:8px 14px}
.dec label{display:inline-flex;align-items:center;gap:4px;cursor:pointer;color:var(--fg);padding:2px 0}
.dec input[type=radio]{accent-color:var(--ac);margin:0}
.dec .dec-rec{font-size:12px;color:var(--fg);opacity:.8;margin:2px 0 6px}.dec .rec-tag{color:var(--ac);font-size:11px;margin-left:2px}.dec .dec-vote{margin-top:8px;font-size:12px;border-top:1px dotted var(--ac);padding-top:6px}.dec .dec-vote div{margin:2px 0}
#chgbar{display:none;position:sticky;top:41px;z-index:4;max-width:760px;margin:0 auto;padding:6px 20px;background:var(--hd);border-bottom:1px solid var(--bd);font-family:sans-serif;font-size:13px;align-items:center;gap:8px;flex-wrap:wrap}#chgbar.show{display:flex}#chgbar b{color:var(--chg-bd);font-weight:600}#chgbar button{font:inherit;font-size:12px;padding:3px 10px}#decbar{max-width:760px;margin:10px auto 0;padding:0 20px;font-family:sans-serif;font-size:13px;color:var(--mu)}
#decbar b{color:var(--ac);font-weight:600}
del.dd{background:#fbd5d0;color:#a12a1c;text-decoration:line-through;text-decoration-color:#c0392b}ins.di{background:#cdeed6;color:#1d6b35;text-decoration:none}
:root[data-theme=dark] del.dd{background:#5a2620;color:#f3b3a9}:root[data-theme=dark] ins.di{background:#1f4a2c;color:#a6e3b5}@media(prefers-color-scheme:dark){:root:not([data-theme=light]) del.dd{background:#5a2620;color:#f3b3a9}:root:not([data-theme=light]) ins.di{background:#1f4a2c;color:#a6e3b5}}
body:not(.cmp) .tx-d,body.cmp .tx-n{display:none}body:not(.cmp) .delp{display:none}p .chg-badge{cursor:pointer}
.delp{margin:0 0 .9em;padding:6px 10px;border-radius:4px;background:#fbd5d0;color:#a12a1c;font-size:15px;line-height:1.8;font-family:sans-serif;border-left:3px solid #c0392b}.delp s{text-decoration-color:#c0392b}.delp .dl{font-size:11px;font-weight:600;margin-right:6px}
.oldbox{margin:-.5em 0 .9em;padding:6px 10px;border:1px dashed var(--bd);border-radius:4px;background:var(--card);color:var(--mu);font-size:15px;line-height:1.8;font-family:sans-serif}.oldbox .dl{font-size:11px;font-weight:600;margin-right:6px;color:var(--fg)}
.dec .dec-done{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;margin-top:4px;font-size:14px}
.dec .dec-act{margin-top:8px}
.dec .dec-btn{font:inherit;font-size:13px;padding:3px 12px;border:1px solid var(--bd);background:var(--card);border-radius:6px;cursor:pointer;color:var(--fg)}
.dec .dec-cfm{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
#cbx{position:fixed;inset:20% 5% auto 5%;height:50%;z-index:20;display:none;width:90%;font:14px/1.5 sans-serif;background:var(--card);color:var(--fg);border:2px solid var(--ac);border-radius:8px;padding:8px}
@media(max-width:600px){#xm,#xj,#cp,#sub,#meta{display:none}.big{font-size:14px;padding:6px 10px}}
@media(max-width:900px){aside{display:none;position:fixed;inset:45px 0 0 0;width:auto;height:auto;background:var(--bg);z-index:6}aside.open{display:block}#tg{display:inline}p .n{position:static;display:inline-block;width:auto;margin-right:.4em}p .chg-badge{position:static;display:inline-block;margin:0 .35em 0 0;vertical-align:middle}p{font-size:17px;text-indent:0}header{padding:8px}}

const D=P.paras,DECS=P.decisions||[],K='rv:'+FID+':'+P.fp,DK=K+':dec',TITLE=P.title,BOOK=P.book,CH=P.ch,REPO='https://github.com/r42hgghpkz-lang/review/issues/new';let A=[],DEC={},cur=null,pend=null;const $=i=>document.getElementById(i);
const m=$('m'),sd=$('sd'),st=$('st');
function loadDec(){try{DEC=JSON.parse(localStorage.getItem(DK)||'{}')||{}}catch(e){DEC={}}
let mig=false;for(let k in DEC){if(typeof DEC[k]==='string'){DEC[k]={choice:DEC[k],confirmed:true};mig=true}}if(mig)saveDec()}
function saveDec(){try{localStorage.setItem(DK,JSON.stringify(DEC))}catch(e){}}
function apOf(d,o){let a=(d.applies||{})[o];return a&&a.apply!=null?a.apply:null}
function apHint(d,o){let a=apOf(d,o);return a==null?'⚠ 此项无落地句（编辑需补）':(a==='='?'正文不改':'将随锁定改正文为：「'+(a.length>60?a.slice(0,60)+'…':a)+'」')}
function entryOf(d){let e=DEC[d.id];if(e==null)return null;if(typeof e==='string')return{choice:e,confirmed:true};return e}
function choiceOf(d){let e=entryOf(d);return(e&&e.choice)?e.choice:(d.default||(d.options&&d.options[0])||'')}
function isConfirmed(d){let e=entryOf(d);return!!(e&&e.confirmed)}
function pendingDec(){return DECS.filter(d=>!isConfirmed(d)).length}
function confirmedDec(){return DECS.filter(d=>isConfirmed(d)).length}
function updDecBanner(){let bar=$('decbar');if(!DECS.length){bar.innerHTML='';return}let p=pendingDec(),c=confirmedDec();bar.innerHTML=p?'<b>待确认 '+p+' 项</b> · 已确认 '+c+' 项 · 共 '+DECS.length+' 项；确认后随锁定/打回一并提交':'已确认 '+c+' 项 · 随锁定/打回一并提交'}
function decEl(d){let box=document.createElement('div');box.className='dec';box.dataset.id=d.id;
function paint(){box.innerHTML='';
let lab=document.createElement('div');lab.className='dec-lab';lab.textContent=(d.major?'重大决策 · ':'待决策 · ')+d.label;
let rec=document.createElement('div');rec.className='dec-rec';rec.textContent='推荐：'+(d.default||'')+(d.reason?'｜理由：'+d.reason:'');
box.append(lab,rec);
if(isConfirmed(d)){let st=document.createElement('div');st.className='dec-done';let sp=document.createElement('span');sp.textContent='已确认：'+choiceOf(d);let hn=document.createElement('div');hn.className='dec-rec dec-apply';hn.textContent=apHint(d,choiceOf(d));let btn=document.createElement('button');btn.type='button';btn.className='dec-btn';btn.textContent='改';
btn.onclick=e=>{e.stopPropagation();DEC[d.id]={choice:choiceOf(d),confirmed:false};saveDec();updDecBanner();paint()};st.append(sp,btn);box.append(st,hn)}
else{let opts=document.createElement('div');opts.className='dec-opts';let cur=choiceOf(d);
(d.options||[]).forEach(o=>{let lb=document.createElement('label');let inp=document.createElement('input');inp.type='radio';inp.name='dec-'+d.id;inp.value=o;if(cur===o)inp.checked=true;
inp.onchange=()=>{DEC[d.id]={choice:o,confirmed:false};saveDec()};
if(o===d.default){let tg=document.createElement('span');tg.className='rec-tag';tg.textContent='（推荐）';lb.append(inp,document.createTextNode(' '+o),tg)}else lb.append(inp,document.createTextNode(' '+o));opts.append(lb)});
let act=document.createElement('div');act.className='dec-act';let cf=document.createElement('button');cf.type='button';cf.className='dec-btn dec-cfm';cf.textContent='确认';
cf.onclick=e=>{e.stopPropagation();let sel=box.querySelector('input[name="dec-'+d.id+'"]:checked');if(!sel){alert('请先选择一项');return}DEC[d.id]={choice:sel.value,confirmed:true};saveDec();updDecBanner();paint()};
act.append(cf);box.append(opts,act)}
if(d.major||d.votes){let vp=document.createElement('div');vp.className='dec-vote';let vs=d.votes||[];let hd=document.createElement('div');hd.textContent='席位投票（'+vs.length+'席）· 计票：'+(Object.entries(d.tally||{}).map(([k,n])=>k+' '+n+'票').join('，')||'暂无');vp.append(hd);vs.forEach(v=>{let r=document.createElement('div');r.textContent=v.seat+'：'+v.choice+' — '+v.reason;vp.append(r)});let ft=document.createElement('div');ft.textContent='作者拍板为准';vp.append(ft);box.append(vp)}}
paint();box.addEventListener('click',e=>e.stopPropagation());box.addEventListener('mousedown',e=>e.stopPropagation());return box}
loadDec();
DECS.filter(d=>d.after===0).forEach(d=>m.append(decEl(d)));
const PD=P.pd||{},DELS=P.dels||[];
function delEl(x,k){let d=document.createElement('div');d.className='delp';d.id='dp'+k;let l=document.createElement('span');l.className='dl';l.textContent='删除段';let t=document.createElement('s');t.textContent=x.text;d.append(l,t);return d}
DELS.forEach((x,k)=>{if(x.after===0)m.append(delEl(x,k))});
D.forEach((t,i)=>{let p=document.createElement('p');p.id='p'+(i+1);p.dataset.n=i+1;p.innerHTML='<span class="n">'+(i+1)+'</span>';let pd=PD[String(i+1)];
if(pd){let tn=document.createElement('span');tn.className='tx-n';tn.textContent=t;let td=document.createElement('span');td.className='tx-d';(pd.ops||[]).forEach(o=>{if(o[0]=='=')td.append(document.createTextNode(o[1]));else{let e=document.createElement(o[0]=='-'?'del':'ins');e.className=o[0]=='-'?'dd':'di';e.textContent=o[1];td.append(e)}});p.append(tn,td)}else p.append(document.createTextNode(t));m.append(p);
DECS.filter(d=>d.after===i+1).forEach(d=>m.append(decEl(d)));DELS.forEach((x,k)=>{if(x.after===i+1)m.append(delEl(x,k))})});
updDecBanner();
const CHG=Object.keys(PD).map(Number).filter(n=>n>0).sort((a,b)=>a-b);
const NAV=[...m.querySelectorAll('p,.delp')].filter(e=>e.classList.contains('delp')||PD[e.dataset.n]).map(e=>e.id);
let CMP=localStorage.getItem('rv-cmp')!=='0';document.body.classList.toggle('cmp',CMP);
function toggleOld(n){let p=$('p'+n),pd=PD[String(n)];if(!p||!pd)return;let nx=p.nextElementSibling;if(nx&&nx.classList.contains('oldbox')){nx.remove();return}let b=document.createElement('div');b.className='oldbox';let l=document.createElement('span');l.className='dl';l.textContent=pd.add?'原文：（本段为新增，旧版无）':'原文（旧版）：';b.append(l,document.createTextNode(pd.add?'':pd.old));b.onclick=e=>{e.stopPropagation();b.remove()};p.after(b)}
let ci=-1;
function markChg(){CHG.forEach(n=>{let p=$('p'+n);if(!p)return;p.classList.add('chg');if(!p.querySelector('.chg-badge')){let b=document.createElement('span');b.className='chg-badge';b.textContent=PD[String(n)].add?'新':'改';b.title='展开/收起原文';b.onclick=e=>{e.stopPropagation();toggleOld(n)};p.append(b)}})}
function jumpChg(dir){if(!NAV.length)return;ci=(ci+dir+NAV.length)%NAV.length;let el=$(NAV[ci]);if(!el)return;document.querySelectorAll('p.chg-focus').forEach(p=>p.classList.remove('chg-focus'));el.classList.add('chg-focus');el.scrollIntoView({behavior:'smooth',block:'center'});let cur=$('chgcur');if(cur)cur.textContent=(ci+1)+'/'+NAV.length}
function setupChgbar(){let bar=$('chgbar');if(!NAV.length){bar.classList.remove('show');bar.innerHTML='';return}
bar.classList.add('show');bar.innerHTML='';let lab=document.createElement('b');lab.textContent='改动 '+NAV.length+' 处'+(DELS.length?'（含删除 '+DELS.length+' 段）':'');lab.style.cursor='pointer';lab.title='跳到第一处';lab.onclick=()=>{ci=-1;jumpChg(1)};
let cur=document.createElement('span');cur.id='chgcur';cur.style.color='var(--mu)';cur.textContent='—/'+NAV.length;
let prev=document.createElement('button');prev.type='button';prev.textContent='上一条';prev.onclick=()=>jumpChg(-1);
let next=document.createElement('button');next.type='button';next.textContent='下一条';next.onclick=()=>jumpChg(1);
let tg=document.createElement('button');tg.type='button';tg.id='cmpbtn';const lbl=()=>tg.textContent=CMP?'对比视图 ✓ · 切到只看新文':'只看新文 ✓ · 切到对比视图';lbl();tg.onclick=()=>{CMP=!CMP;localStorage.setItem('rv-cmp',CMP?'1':'0');document.body.classList.toggle('cmp',CMP);lbl()};
let hint=document.createElement('span');hint.style.color='var(--mu)';hint.textContent='点「改」或改动段看整段原文';bar.append(lab,cur,prev,next,tg,hint)}
markChg();setupChgbar();
const txt=p=>D[+p.dataset.n-1]||'';
const enc=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const dec=h=>JSON.parse(decodeURIComponent(escape(atob(h.replace(/-/g,'+').replace(/_/g,'/')))));
function sync(){let o={v:Date.now(),a:A};try{localStorage.setItem(K,JSON.stringify(o))}catch(e){}
st.textContent='✓ 已保存 '+new Date().toTimeString().slice(0,5)}
function load(){let h=null,l=null;try{let m=location.hash.match(/n=([\w-]+)/);if(m)h=dec(m[1])}catch(e){}try{l=JSON.parse(localStorage.getItem(K)||'null')}catch(e){}
let o=[h,l].filter(x=>x&&x.a).sort((x,y)=>y.v-x.v)[0];A=o?o.a:[];st.textContent=A.length?'✓ 已载入':'';if(o)sync();render()}
function plain(){return A.slice().sort((a,b)=>a.n-b.n).map(x=>'¶'+x.n+'｜'+x.q.replace(/\s*\n\s*/g,' ')+'｜'+x.c.replace(/\s*\n\s*/g,' ')).join('\n')}
function boxCopy(t){let b=$('cbx');b.value=t;b.style.display='block';b.focus();b.select();b.setSelectionRange(0,t.length);st.textContent='请长按/Ctrl+C 复制，点空白处关闭'}
function legacy(t){let ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.append(ta);ta.select();ta.setSelectionRange(0,t.length);let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();return ok}
async function copyAll(){if(!A.length){st.textContent='还没有批注';return}let t=plain();
try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t);return done('clipboard')}}catch(e){}
if(legacy(t))return done('execCommand');boxCopy(t)}
function done(w){st.textContent='✓ 已复制 '+A.length+' 条';window.__copied=w}
function bodyPlain(){return D.join('\n\n')}
async function copyBody(){let t=bodyPlain();if(!t){st.textContent='没有正文';return}
try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t);st.textContent='✓ 已复制正文 '+D.length+' 段';window.__copiedBody='clipboard';return}}catch(e){}
if(legacy(t)){st.textContent='✓ 已复制正文 '+D.length+' 段';window.__copiedBody='execCommand';return}
boxCopy(t)}
function dl(name,text,type){let blob=new Blob([text],{type:type+';charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.rel='noopener';a.style.display='none';document.body.append(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(u)},4000)}
async function submit(action){if(action=='打回'&&!A.length){alert('打回请先写批注（点段落或选中文字）。');return}
if(action=='批注'&&!A.length){st.textContent='还没有批注';return}
if(action=='锁定'&&!confirm('确认通过并锁定这一版？'+(DECS.length?'\n\n决策将落正文（编辑执行 apply_decisions，未落地不得发布）：\n'+DECS.map(d=>'· '+d.label+'＝'+choiceOf(d)+' → '+apHint(d,choiceOf(d))).join('\n'):'')))return;if(action=='打回'&&!confirm('确认打回？共 '+A.length+' 条批注会一并提交。'))return;
let decisions=DECS.map(d=>{let c=choiceOf(d),a=apOf(d,c),k=((d.applies||{})[c]||{}).keys||[];return{id:d.id,label:d.label,choice:c,confirmed:isConfirmed(d),apply:a,keys:k}});
if((action=='锁定'||action=='打回')&&DECS.length&&pendingDec()){if(!confirm('还有 '+pendingDec()+' 项待确认（将按已选或默认项提交）。仍要'+(action=='锁定'?'锁定':'打回')+'？'))return}
let payload={v:1,action,book:BOOK,ch:CH,fid:FID,fp:P.fp,time:new Date().toISOString(),notes:so().map(x=>({n:x.n,q:x.q,c:x.c,t:x.t})),decisions};

let title=(action=='批注'?'批注+':'审阅+')+Math.random().toString(36).slice(2,8),body=await encText(JSON.stringify(payload)),u=REPO+'?title='+encodeURIComponent(title)+'&body='+encodeURIComponent(body);
if(u.length<=7000){window.open(u,'_blank')||(location.href=u);st.textContent='已打开 GitHub，点 Submit 提交';return}
let w=window.open(REPO+'?title='+encodeURIComponent(title),'_blank'),ok=false;
try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(body);ok=true}}catch(e){}
if(!ok)ok=legacy(body);if(ok){st.textContent='已复制，粘贴即可';alert('已复制（已加密），粘贴即可。\n在打开的 GitHub 页面正文框里粘贴，再点 Submit。')}else boxCopy(body);if(!w)location.href=REPO+'?title='+encodeURIComponent(title)}
function diffs(){let d=P.diffs||[];if(!d.length)return;let h=document.createElement('details');let sm=document.createElement('summary');sm.textContent='上一版改了 '+d.length+' 处（'+(P.diffFrom||'')+'）— 正文已标改，点开看对照';h.append(sm);
d.forEach(x=>{let r=document.createElement('div');r.className='pr';let b=document.createElement('div'),a=document.createElement('div');b.className='b4';a.className='af';b.textContent=x.b||'（无）';a.textContent=x.a||'（删去）';
let m=document.createElement('div');m.className='mt';m.style.gridColumn='1/-1';let ns=x.ns&&x.ns.length?x.ns:(x.n?[x.n]:[]);m.textContent=ns.length?('改后 ¶'+ns.join('、')):(x.n?('改后 ¶'+x.n):'（仅删）');
if(ns.length){m.style.cursor='pointer';m.title='跳到正文';m.onclick=()=>{let i=NAV.indexOf('p'+ns[0]);ci=i>=0?i-1:-1;jumpChg(1)}};r.append(m,b,a);h.append(r)});$('df').append(h)}
const so=()=>A.slice().sort((a,b)=>a.n-b.n);
function render(){document.querySelectorAll('p.has').forEach(p=>p.classList.remove('has'));sd.innerHTML=A.length?'':'<div style="color:var(--mu)">选中文字后点「批注」，或直接点段落。批注自动保存在本机和网址里；写完点「通过锁定」或「打回」（打回会带上批注），在 GitHub 页面点 Submit 即可。</div>';
A.slice().sort((a,b)=>a.n-b.n||(a.t<b.t?-1:1)).forEach(x=>{let p=$('p'+x.n);p&&p.classList.add('has');let d=document.createElement('div');d.className='c';
d.innerHTML='<span class="h"></span><div class="q"></div><div class="b"></div><div style="text-align:right"><button>编辑</button> <button>删除</button></div>';
d.querySelector('.h').textContent='¶'+x.n+' · '+new Date(x.t).toLocaleString().slice(0,-3);d.querySelector('.q').textContent=x.q;d.querySelector('.b').textContent=x.c;d.querySelector('.h').onclick=()=>p.scrollIntoView({behavior:'smooth',block:'center'});
let [e,r]=d.querySelectorAll('button');e.onclick=()=>open_(x.n,x.q,x);r.onclick=()=>{if(confirm('删除这条批注？')){A=A.filter(y=>y!==x);render();sync()}};sd.append(d)})}
function open_(n,q,ex){$('fb').style.display='none';cur={n,q,ex};document.querySelectorAll('p.sel').forEach(p=>p.classList.remove('sel'));$('p'+n).classList.add('sel');
$('eq').textContent='¶'+n+'：'+q;$('et').value=ex?ex.c:'';$('ed').style.display='block';$('et').focus()}
function close_(){$('ed').style.display='none';document.querySelectorAll('p.sel').forEach(p=>p.classList.remove('sel'));cur=null}
function selInfo(){let s=getSelection();if(!s.rangeCount||s.isCollapsed)return null;let q=s.toString().trim();if(!q)return null;let a=s.anchorNode;a=a.nodeType==1?a:a.parentElement;let p=a&&a.closest('main p');if(!p)return null;return{n:+p.dataset.n,q,r:s.getRangeAt(0).getBoundingClientRect()}}
m.addEventListener('click',e=>{if($('ed').style.display=='block')return;if(selInfo())return;let p=e.target.closest('p');if(p){if(PD[p.dataset.n]&&!(p.nextElementSibling&&p.nextElementSibling.classList.contains('oldbox')))toggleOld(+p.dataset.n);open_(+p.dataset.n,txt(p))}});
document.addEventListener('selectionchange',()=>{clearTimeout(window._t);window._t=setTimeout(()=>{let i=selInfo(),b=$('fb');if(!i){b.style.display='none';return}pend=i;b.style.display='block';
let y=i.r.bottom+8;if(y>innerHeight-50)y=i.r.top-44;b.style.top=Math.max(50,y)+'px';b.style.left=Math.min(innerWidth-90,Math.max(8,i.r.left))+'px'},300)});
$('fb').addEventListener('mousedown',e=>e.preventDefault());$('fb').onclick=()=>{if(pend){open_(pend.n,pend.q);getSelection().removeAllRanges()}};
$('ec').onclick=close_;
$('es').onclick=()=>{let c=$('et').value.trim();if(!cur)return;let now=new Date().toISOString();
if(cur.ex){if(c){cur.ex.c=c;cur.ex.t=now}else A=A.filter(y=>y!==cur.ex)}else if(c)A.push({n:cur.n,q:cur.q,c,t:now});close_();render();sync()};
$('et').onkeydown=e=>{if(e.key=='Enter'&&(e.ctrlKey||e.metaKey))$('es').click();if(e.key=='Escape')close_()};
$('cp').onclick=copyAll;$('tx').onclick=copyBody;$('sub').onclick=()=>submit('批注');$('lk').onclick=()=>submit('锁定');$('rj').onclick=()=>submit('打回');diffs();$('meta').textContent=(P.status||'')+' · 指纹 '+P.fp;$('cbx').onblur=()=>$('cbx').style.display='none';
$('xm').onclick=()=>dl(TITLE+'-批注.md','# '+TITLE+' 批注\n\n'+so().map(x=>'- ¶'+x.n+'　'+x.t+'\n  > '+x.q.replace(/\n/g,' ')+'\n\n  '+x.c.replace(/\n/g,'\n  ')).join('\n\n')+'\n','text/markdown');
$('xj').onclick=()=>dl(TITLE+'-批注.json',JSON.stringify({title:TITLE,notes:so().map(x=>({段号:x.n,原句:x.q,批注:x.c,时间:x.t}))},null,2),'application/json');
$('tg').onclick=()=>sd.classList.toggle('open');
$('th').onclick=()=>{let r=document.documentElement,dk=r.dataset.theme?r.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dk?'light':'dark';localStorage.setItem('rv-theme',r.dataset.theme)};
load();
