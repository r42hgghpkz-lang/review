document.addEventListener('selectionchange',()=>{clearTimeout(window._t);window._t=setTimeout(()=>{let i=selInfo(),b=$('fb');if(!i){b.style.display='none';return}pend=i;b.style.display='block';
let y=i.r.bottom+8;if(y>innerHeight-50)y=i.r.top-44;b.style.top=Math.max(50,y)+'px';b.style.left=Math.min(innerWidth-90,Math.max(8,i.r.left))+'px'},300)});
$('fb').addEventListener('mousedown',e=>e.preventDefault());$('fb').onclick=()=>{if(pend){open_(pend.n,pend.q);getSelection().removeAllRanges()}};
$('ec').onclick=close_;
$('es').onclick=()=>{let c=$('et').value.trim();if(!cur)return;let now=new Date().toISOString();
if(cur.ex){if(c){cur.ex.c=c;cur.ex.t=now}else A=A.filter(y=>y!==cur.ex)}else if(c)A.push({n:cur.n,q:cur.q,c,t:now});close_();render();sync()};
$('et').onkeydown=e=>{if(e.key=='Enter'&&(e.ctrlKey||e.metaKey))$('es').click();if(e.key=='Escape')close_()};
$('cp').onclick=copyAll;$('tx').onclick=copyBody;$('sub').onclick=()=>submit('批注');$('lk').onclick=()=>submit('锁定');$('rj').onclick=()=>submit('打回');diffs();$('meta').textContent=(P.status||'')+' · 指纹 '+P.fp;$('cbx').onblur=()=>$('cbx').style.display='none';
$('xm').onclick=()=>dl(TITLE+'-批注.md','# '+TITLE+' 批注\n\n'+so().map(x=>'- ¶'+x.n+'　'+x.t+'\n  > '+x.q.replace(/\n/g,' ')+'\n\n  '+x.c.replace(/\n/g,'\n  ')).join('\n\n')+'\n','text/markdown');
$('xj').onclick=()=>dl(TITLE+'-批注.json',JSON.stringify({title:TITLE,notes:so().map(x=>({段号:x.n,原句:x.q,批注:x.c,时间:x.t}))},null,2),'application/json');
$('tg').onclick=()=>sd.classList.toggle('open');
$('th').onclick=()=>{let r=document.documentElement,dk=r.dataset.theme?r.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dk?'light':'dark';localStorage.setItem('rv-theme',r.dataset.theme)};
/* 作者手动微调（2026-10-13；16:03 一体）：每段「编辑」→ 本机暂存 → 「提交微调并锁定」加密进 issue（action=微调锁定）；落稿 apply_author_edits → apply_locks */
const EK=K+':edits';let AE={};try{AE=JSON.parse(localStorage.getItem(EK)||'{}')||{}}catch(e){AE={}}let aeN=0;
function aeSync(){try{localStorage.setItem(EK,JSON.stringify(AE))}catch(e){}let k=Object.keys(AE).length,b=$('aes'),lk=$('lk');b.style.display='none';
if(k){lk.textContent='提交微调并锁定（'+k+' 段）';lk.title='一次提交：落改 '+k+' 段并锁定'}else{lk.textContent='通过锁定';lk.title=''}
document.querySelectorAll('main p[data-n]').forEach(p=>{let n=p.dataset.n,on=n in AE;p.classList.toggle('aedit',on);p.title=on?'已微调（待提交）：'+AE[n]:''})}
function aeOpen(n){aeN=n;$('aen').textContent=n;$('aeo').textContent='原文：'+D[n-1];$('aet').value=AE[n]!=null?AE[n]:D[n-1];$('aed').style.display='block';$('aet').focus()}
document.querySelectorAll('main p[data-n]').forEach(p=>{let b=document.createElement('button');b.className='eb';b.textContent='编辑';b.title='作者手动微调这一段';b.onclick=e=>{e.stopPropagation();e.preventDefault();aeOpen(+p.dataset.n)};p.prepend(b)});
$('aec').onclick=()=>{$('aed').style.display='none'};
$('aer').onclick=()=>{delete AE[aeN];$('aed').style.display='none';aeSync()};
$('aeok').onclick=()=>{let v=$('aet').value.replace(/\r/g,'');if(/\n/.test(v)){if(!confirm('改后文含换行，会被合并成一段（换行删掉）。继续？'))return;v=v.replace(/\n+/g,'')}v=v.trim();
if(!v){alert('不能清空整段。要删段请写批注。');return}if(v==D[aeN-1])delete AE[aeN];else AE[aeN]=v;$('aed').style.display='none';aeSync();if(Object.keys(AE).length)submit('作者改动')};
$('aes').onclick=()=>submit('微调锁定');
/* 16:52 作者：「我改动的必须生效」——①旧指纹未交改动迁移（绝不丢）②已生效作者改动标「你改的·已生效」③改动一保存即加密提交 */
let AESENT={};try{AESENT=(JSON.parse(localStorage.getItem(EK+':sent')||'{}')||{}).e||{}}catch(e){}
let MIG=[],CF=[];
function sim(a,b){if(!a||!b)return 0;let g=s=>{let m={};for(let i=0;i<s.length-1;i++){let k=s.substr(i,2);m[k]=(m[k]||0)+1}return m},x=g(a),y=g(b),c=0,t=0;for(let k in x){t+=x[k];if(y[k])c+=Math.min(x[k],y[k])}for(let k in y)t+=y[k];return t?2*c/t:0}
function migrate(){let pre='rv:'+FID+':',H=P.hist||{};for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(!k||!k.startsWith(pre)||!k.endsWith(':edits')||k==EK)continue;let ofp=k.slice(pre.length,-6),o;try{o=JSON.parse(localStorage.getItem(k)||'{}')||{}}catch(e){continue}
let OP=H[ofp]||[];Object.keys(o).forEach(n=>{let mine=String(o[n]||'').trim();if(!mine)return;let old=OP[n-1]||'';
if(D.includes(mine)){MIG.push({from:ofp,n:D.indexOf(mine)+1,mine,st:'已生效'});return}
let hits=old?D.map((x,i)=>x==old?i:-1).filter(i=>i>=0):[];
if(hits.length==1){let m=hits[0]+1;if(AE[m]==null||AE[m]==mine){AE[m]=mine;MIG.push({from:ofp,n:m,mine,old,st:'原段未变·直接套用'})}else{CF.push({from:ofp,n:m,mine,theirs:AE[m],old,kind:'本页另有改动'});AE[m]=mine}return}
let bi=-1,bs=0;D.forEach((x,i)=>{let v=Math.max(sim(old,x),sim(mine,x)*.95);if(v>bs){bs=v;bi=i}});
if(bi<0||bs<.3){CF.push({from:ofp,n:0,mine,theirs:'',old,kind:'新版找不到对应段'});return}
let m=bi+1;CF.push({from:ofp,n:m,mine,theirs:D[bi],old,kind:'流水线改过这段'});AE[m]=mine;MIG.push({from:ofp,n:m,mine,old,st:'冲突·默认用你的'})});
try{localStorage.setItem('rv-arch:'+k+':'+Date.now(),JSON.stringify(o));localStorage.removeItem(k);i--}catch(e){}}
if(MIG.length||CF.length){try{localStorage.setItem(EK,JSON.stringify(AE));localStorage.setItem(EK+':cf',JSON.stringify(CF))}catch(e){}}
else{try{CF=JSON.parse(localStorage.getItem(EK+':cf')||'[]')||[]}catch(e){CF=[]}}}
function migBar(){let b=$('migbar');if(!b){b=document.createElement('div');b.id='migbar';$('df').before(b)}let pend=Object.keys(AE).filter(n=>AE[n]!=D[n-1]);let lost=CF.filter(c=>!c.n);
if(!pend.length&&!lost.length){b.innerHTML='';b.style.display='none';return}b.style.display='block';
let sent=pend.filter(n=>AESENT[n]==AE[n]).length;
b.innerHTML='<b>你的改动 '+pend.length+' 段待落正文</b>'+(sent?'（其中 '+sent+' 段已提交，等流水线落稿；落稿后这里会消失、正文标「你改的·已生效」）':'')+(MIG.length?'<br>已从旧版页面救回 '+MIG.length+' 段未提交改动。':'')+' <button id="migsub" class="big">提交这些改动（加密到 GitHub）</button>';
let cfs=CF;cfs.forEach((c,j)=>{let d=document.createElement('div');d.className='cfx';d.innerHTML='<div class="mt">冲突 ¶'+(c.n||'?')+'：'+c.kind+'</div><div class="cfg"><div><b>你的改动</b><div class="t1"></div></div><div><b>新版</b><div class="t2"></div></div></div>'+(c.n?'<label><input type="radio" name="cf'+j+'" value="m" checked> 用我的（默认）</label> <label><input type="radio" name="cf'+j+'" value="t"> 用新版</label>':'<i>新版里找不到对应段：这段改动已保存在本机不会丢，请复制后用批注告诉流水线放哪</i>');d.querySelector('.t1').textContent=c.mine;d.querySelector('.t2').textContent=c.theirs||'（找不到）';
d.querySelectorAll('input').forEach(r=>r.onchange=()=>{if(r.value=='t'){delete AE[c.n]}else AE[c.n]=c.mine;aeSync()});if(c.n&&AE[c.n]==null)d.querySelector('input[value=t]').checked=true;b.append(d)});
$('migsub').onclick=()=>submit('作者改动')}
function markAuthored(){(P.authored||[]).forEach(a=>{let p=$('p'+a.n);if(!p||p.querySelector('.aut'))return;p.classList.add('authd');let t=document.createElement('span');t.className='aut';t.textContent='你改的·已生效';t.title='你改的这段已落正文并锁定（写手／改单不得改动）'+(a.old?'\n原：'+a.old:'');p.append(t)})}
migrate();Object.keys(AE).forEach(n=>{if(AE[n]==D[n-1])delete AE[n]});
const _aeS=aeSync;aeSync=function(){_aeS();migBar()};
markAuthored();
aeSync();
load();
</script></body></html>
