function sim(a,b){if(!a||!b)return 0;let g=s=>{let m={};for(let i=0;i<s.length-1;i++){let k=s.substr(i,2);m[k]=(m[k]||0)+1}return m},x=g(a),y=g(b),c=0,t=0;for(let k in x){t+=x[k];if(y[k])c+=Math.min(x[k],y[k])}for(let k in y)t+=y[k];return t?2*c/t:0}

function mineInBody(mine,D,old){mine=String(mine||'');let ix=D.indexOf(mine);if(ix>=0)return ix+1;let ps=mine.replace(/\r/g,'').split('\n').map(s=>s.trim()).filter(Boolean);if(ps.length<2)return 0;for(let i=0;i<=D.length-ps.length;i++){let ok=1;for(let j=0;j<ps.length;j++)if(D[i+j]!==ps[j]){ok=0;break}if(ok)return i+1}if(old!=null&&String(old)!==''&&!D.includes(old)&&ps.every(p=>D.includes(p))){let i=D.indexOf(ps[0]);return i>=0?i+1:0}return 0}
function migrate(){let pre='rv:'+FID+':',H=P.hist||{};for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(!k||!k.startsWith(pre)||!k.endsWith(':edits')||k==EK)continue;let ofp=k.slice(pre.length,-6),o;try{o=JSON.parse(localStorage.getItem(k)||'{}')||{}}catch(e){continue}
let OP=H[ofp]||[];Object.keys(o).forEach(n=>{let mine=String(o[n]||'').trim();if(!mine)return;let old=OP[n-1]||'';
let at=mineInBody(mine,D,old);if(at){MIG.push({from:ofp,n:at,mine,st:'已生效'});return}
let hits=old?D.map((x,i)=>x==old?i:-1).filter(i=>i>=0):[];
if(hits.length==1){let m=hits[0]+1;if(AE[m]==null||AE[m]==mine){AE[m]=mine;MIG.push({from:ofp,n:m,mine,old,st:'原段未变·直接套用'})}else{CF.push({from:ofp,n:m,mine,theirs:AE[m],old,kind:'本页另有改动'});AE[m]=mine}return}
let bi=-1,bs=0;D.forEach((x,i)=>{let v=Math.max(sim(old,x),sim(mine,x)*.95);if(v>bs){bs=v;bi=i}});
if(bi<0||bs<.3){CF.push({from:ofp,n:0,mine,theirs:'',old,kind:'新版找不到对应段'});return}
let m=bi+1;CF.push({from:ofp,n:m,mine,theirs:D[bi],old,kind:'流水线改过这段'});AE[m]=mine;MIG.push({from:ofp,n:m,mine,old,st:'冲突·默认用你的'})});
try{localStorage.setItem('rv-arch:'+k+':'+Date.now(),JSON.stringify(o));localStorage.removeItem(k);i--}catch(e){}}

function debriefBox(){const R=P.debrief||[];if(!R.length)return;const E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

h+='<details data-file="'+E(r.file)+'"'+(live?' data-live="1" open':'')+' style="margin:8px 0"><summary style="cursor:pointer;font-weight:bold">第'+r.round+'轮追问单 · '+(r.answered?'已答 issue#'+E(r.answered.issue)+'（只读）':'待答 · '+r.qs.length+' 问（点开回答）')+'</summary>';

+(q.ctx&&q.ctx.length?'<div style="margin:8px 0;padding:8px 10px;border-radius:6px;background:var(--bg,#1b1c1e);line-height:1.7"><div style="font-size:12px;opacity:.6;margin-bottom:4px">原文上下文（AI 稿）</div>'+q.ctx.map(c=>c.hit?'<div style="margin:4px 0;padding:4px 8px;border-left:4px solid #f0b429;background:rgba(240,180,41,.15);font-weight:bold">¶'+c.p+'　'+E(c.t)+'</div>':'<div style="opacity:.6;font-size:14px;margin:3px 0">¶'+c.p+'　'+E(c.t)+'</div>').join('')+'</div>':'')

if(o.fill)h+=live?'<textarea data-for="'+o.k+'" rows="2" placeholder="'+(o.k=='D'?'写下你的答案':'请补充（姓名／取用特征／适用场合等）')+'" style="display:none;width:100%;font:inherit;background:var(--bg,#1b1c1e);color:inherit;border:1px solid var(--bd,#34353a);border-radius:6px;padding:6px"></textarea>':(chk&&a.text?'<div style="margin-left:22px;border-left:3px solid var(--ac,#e0705f);padding-left:8px">你填：'+E(a.text)+'</div>':'')});h+='</fieldset>'});
