function sim(a,b){if(!a||!b)return 0;let g=s=>{let m={};for(let i=0;i<s.length-1;i++){let k=s.substr(i,2);m[k]=(m[k]||0)+1}return m},x=g(a),y=g(b),c=0,t=0;for(let k in x){t+=x[k];if(y[k])c+=Math.min(x[k],y[k])}for(let k in y)t+=y[k];return t?2*c/t:0}
/** 连续段：多行 mine 已落成 D 连续段（或分行均在 D 且 old 已不在）则视为已生效，勿再写入 AE（防断行修改重复） */
function mineInBody(mine,D,old){mine=String(mine||'');let ix=D.indexOf(mine);if(ix>=0)return ix+1;let ps=mine.replace(/\r/g,'').split('\n').map(s=>s.trim()).filter(Boolean);if(ps.length<2)return 0;for(let i=0;i<=D.length-ps.length;i++){let ok=1;for(let j=0;j<ps.length;j++)if(D[i+j]!==ps[j]){ok=0;break}if(ok)return i+1}if(old!=null&&String(old)!==''&&!D.includes(old)&&ps.every(p=>D.includes(p))){let i=D.indexOf(ps[0]);return i>=0?i+1:0}return 0}
function migrate(){let pre='rv:'+FID+':',H=P.hist||{};for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(!k||!k.startsWith(pre)||!k.endsWith(':edits')||k==EK)continue;let ofp=k.slice(pre.length,-6),o;try{o=JSON.parse(localStorage.getItem(k)||'{}')||{}}catch(e){continue}
let OP=H[ofp]||[];Object.keys(o).forEach(n=>{let mine=String(o[n]||'').trim();if(!mine)return;let old=OP[n-1]||'';
let at=mineInBody(mine,D,old);if(at){MIG.push({from:ofp,n:at,mine,st:'已生效'});return}
let hits=old?D.map((x,i)=>x==old?i:-1).filter(i=>i>=0):[];
if(hits.length==1){let m=hits[0]+1;if(AE[m]==null||AE[m]==mine){AE[m]=mine;MIG.push({from:ofp,n:m,mine,old,st:'原段未变·直接套用'})}else{CF.push({from:ofp,n:m,mine,theirs:AE[m],old,kind:'本页另有改动'});AE[m]=mine}return}
let bi=-1,bs=0;D.forEach((x,i)=>{let v=Math.max(sim(old,x),sim(mine,x)*.95);if(v>bs){bs=v;bi=i}});
if(bi<0||bs<.3){CF.push({from:ofp,n:0,mine,theirs:'',old,kind:'新版找不到对应段'});return}
let m=bi+1;CF.push({from:ofp,n:m,mine,theirs:D[bi],old,kind:'流水线改过这段'});AE[m]=mine;MIG.push({from:ofp,n:m,mine,old,st:'冲突·默认用你的'})});
try{localStorage.setItem('rv-arch:'+k+':'+Date.now(),JSON.stringify(o));localStorage.removeItem(k);i--}catch(e){}}
if(MIG.length||CF.length){try{localStorage.setItem(EK,JSON.stringify(AE));localStorage.setItem(EK+':cf',JSON.stringify(CF))}catch(e){}}
else{try{CF=JSON.parse(localStorage.getItem(EK+':cf')||'[]')||[]}catch(e){CF=[]}}}
function migBar(){let b=$('migbar');if(!b){b=document.createElement('div');b.id='migbar';$('df').before(b)}let pend=Object.keys(AE).filter(n=>AE[n]!=D[n-1]);let lost=CF.filter(c=>!c.n);
if((!pend.length&&!lost.length)||(!MIG.length&&!CF.length)){b.innerHTML='';b.style.display='none';return}b.style.display='block';

b.innerHTML='<b>你的改动 '+pend.length+' 段待落正文</b>'+(sent?'（其中 '+sent+' 段已提交，等流水线落稿；落稿后这里会消失、正文标「你改的·已生效」）':'')+(MIG.length?'<br>已从旧版页面救回 '+MIG.length+' 段未提交改动。':'')+' <button id="migsub" class="big">提交这些改动（加密到 GitHub）</button>';
let cfs=CF;cfs.forEach((c,j)=>{let d=document.createElement('div');d.className='cfx';d.innerHTML='<div class="mt">冲突 ¶'+(c.n||'?')+'：'+c.kind+'</div><div class="cfg"><div><b>你的改动</b><div class="t1"></div></div><div><b>新版</b><div class="t2"></div></div></div>'+(c.n?'<label><input type="radio" name="cf'+j+'" value="m" checked> 用我的（默认）</label> <label><input type="radio" name="cf'+j+'" value="t"> 用新版</label>':'<i>新版里找不到对应段：这段改动已保存在本机不会丢，请复制后用批注告诉流水线放哪</i>');d.querySelector('.t1').textContent=c.mine;d.querySelector('.t2').textContent=c.theirs||'（找不到）';
d.querySelectorAll('input').forEach(r=>r.onchange=()=>{if(r.value=='t'){delete AE[c.n]}else AE[c.n]=c.mine;aeSync()});if(c.n&&AE[c.n]==null)d.querySelector('input[value=t]').checked=true;b.append(d)});

/* 复盘追问单（通用，按轮）：P.debrief=[{round,file,qs,answered?}]；未答轮可提交，已答轮只读 */
function debriefBox(){const R=P.debrief||[];if(!R.length)return;const E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

h+='<details data-file="'+E(r.file)+'"'+(live?' data-live="1" open':'')+' style="margin:8px 0"><summary style="cursor:pointer;font-weight:bold">第'+r.round+'轮追问单 · '+(r.answered?'已答 issue#'+E(r.answered.issue)+'（只读）':'待答 · '+r.qs.length+' 问（点开回答）')+'</summary>';
if(live)h+='<div style="font-size:13px;opacity:.75;margin:6px 0">每题单选；★为推荐（附理由）；D 自填。答复交流程落档后才改稿。</div>';
r.qs.forEach(q=>{const a=A[q.id]||{};h+='<fieldset data-q="'+E(q.id)+'" style="border:1px solid var(--bd,#34353a);border-radius:8px;margin:10px 0;padding:8px 10px"><legend><b>'+E(q.id)+'</b> '+E(q.title)+'</legend>'+(q.intro?'<div style="font-size:13px;opacity:.75">'+E(q.intro)+'</div>':'')
+(q.ctx&&q.ctx.length?'<div style="margin:8px 0;padding:8px 10px;border-radius:6px;background:var(--bg,#1b1c1e);line-height:1.7"><div style="font-size:12px;opacity:.6;margin-bottom:4px">原文上下文（AI 稿）</div>'+q.ctx.map(c=>c.hit?'<div style="margin:4px 0;padding:4px 8px;border-left:4px solid #f0b429;background:rgba(240,180,41,.15);font-weight:bold">¶'+c.p+'　'+E(c.t)+'</div>':'<div style="opacity:.6;font-size:14px;margin:3px 0">¶'+c.p+'　'+E(c.t)+'</div>').join('')+'</div>':'')
+(q.note?'<div style="margin:6px 0;padding:6px 10px;border-left:4px solid var(--ac,#e0705f);background:rgba(224,112,95,.15)"><b style="color:var(--ac,#e0705f)">你的批注：</b>「'+E(q.note)+'」</div>':'')
+(q.fields?q.fields.map(f=>'<div style="margin:4px 0;line-height:1.6"><b>'+E(f.k)+'：</b>'+E(f.v)+'</div>').join(''):'')
+(q.r1?'<div style="margin:6px 0;font-size:13px;opacity:.7;border:1px dashed var(--bd,#34353a);border-radius:6px;padding:4px 8px">第1轮答复（旧视角，仅供参考）：'+E(q.r1)+'</div>':'');
q.opts.forEach(o=>{const chk=a.pick===o.k;h+='<label style="display:block;margin:6px 0;line-height:1.5'+(r.answered&&!chk?';opacity:.5':'')+'"><input type="radio" name="db-'+r.round+'-'+E(q.id)+'" value="'+o.k+'"'+(chk?' checked':'')+(live?'':' disabled')+'> <b>'+o.k+(o.rec?' ★推荐':'')+'</b>　'+E(o.t)+(o.why?'<div style="font-size:13px;opacity:.75;margin-left:22px">理由：'+E(o.why)+'</div>':'')+'</label>';
if(o.fill)h+=live?'<textarea data-for="'+o.k+'" rows="2" placeholder="'+(o.k=='D'?'写下你的答案':'请补充（姓名／取用特征／适用场合等）')+'" style="display:none;width:100%;font:inherit;background:var(--bg,#1b1c1e);color:inherit;border:1px solid var(--bd,#34353a);border-radius:6px;padding:6px"></textarea>':(chk&&a.text?'<div style="margin-left:22px;border-left:3px solid var(--ac,#e0705f);padding-left:8px">你填：'+E(a.text)+'</div>':'')});h+='</fieldset>'});
if(live)h+='<button type="button" class="dbsub big" style="background:var(--ac,#e0705f);color:#fff;border:0;padding:8px 18px;font-size:16px">提交第'+r.round+'轮复盘答复</button> <span class="dbst">'+(localStorage.getItem(sentK)?'✓ 已提交 '+E(localStorage.getItem(sentK)):'')+'</span>';h+='</details>'});
box.innerHTML=h;const wrap=document.querySelector('.wrap');
if(pend){wrap.before(box);box.style.cssText+='margin:12px auto 16px;';const live=box.querySelector('details[data-live="1"]')||box.querySelector('details');if(live)live.open=true}
else{wrap.after(box)}
