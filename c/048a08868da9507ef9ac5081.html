<script>(function(){var m=localStorage.getItem('rv-theme');if(m)document.documentElement.dataset.theme=m})()</script><style>
:root{--bg:#faf8f3;--fg:#2b2b2b;--mu:#999;--ac:#c0392b;--hl:#fff1b8;--hv:#f1ece2;--card:#fff;--bd:#e6e0d4;--hd:#fffdf8ee;--chg:#e6f3ef;--chg-bd:#2a9d8f}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1c1e;--fg:#d8d4cc;--mu:#777;--ac:#e0705f;--hl:#4a4020;--hv:#26272a;--card:#242528;--bd:#34353a;--hd:#1b1c1eee;--chg:#1e2e2a;--chg-bd:#3dbdae}}
:root[data-theme=dark]{--bg:#1b1c1e;--fg:#d8d4cc;--mu:#777;--ac:#e0705f;--hl:#4a4020;--hv:#26272a;--card:#242528;--bd:#34353a;--hd:#1b1c1eee;--chg:#1e2e2a;--chg-bd:#3dbdae}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:"PingFang SC","Noto Serif CJK SC","Source Han Serif SC","Songti SC",serif}
header{position:sticky;top:0;background:var(--hd);border-bottom:1px solid var(--bd);padding:8px 16px;display:flex;gap:8px;align-items:center;z-index:5;font-family:sans-serif;font-size:14px}
header b{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}#st{color:var(--mu);font-size:12px}
button{font:inherit;color:var(--fg);border:1px solid var(--bd);background:var(--card);border-radius:6px;padding:4px 10px;cursor:pointer}
.wrap{display:flex;max-width:1200px;margin:auto}main{flex:1;max-width:760px;margin:auto;padding:24px 20px 140px}
p{position:relative;font-size:18px;line-height:1.95;margin:0 0 .9em;text-indent:2em;text-align:justify;padding:2px 6px;border-radius:4px}
p:hover{background:var(--hv)}p.has{background:var(--hl)}p.chg{background:var(--chg);box-shadow:inset 3px 0 0 var(--chg-bd)}p.chg.has{background:var(--hl);box-shadow:inset 3px 0 0 var(--chg-bd)}p.chg-focus{outline:2px solid var(--chg-bd)}p.sel{outline:2px solid var(--ac)}
p .n{position:absolute;left:-2.4em;top:.35em;text-indent:0;font:12px/1 sans-serif;color:var(--mu);width:2em;text-align:right;user-select:none}p .chg-badge{position:absolute;left:-3.6em;top:1.6em;text-indent:0;font:10px/1 sans-serif;color:#fff;background:var(--chg-bd);border-radius:3px;padding:2px 3px;user-select:none}
aside{width:340px;border-left:1px solid var(--bd);height:calc(100vh - 45px);position:sticky;top:45px;overflow:auto;padding:12px;font-family:sans-serif;font-size:14px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px;margin-bottom:10px}.c .q{color:var(--mu);border-left:3px solid var(--ac);padding-left:6px;margin:4px 0}.c .h{color:var(--ac);font-size:12px;cursor:pointer}
#ed{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(560px,94vw);background:var(--card);border:1px solid var(--bd);border-radius:10px;box-shadow:0 6px 24px #0004;padding:10px;display:none;z-index:9;font-family:sans-serif}
#ed textarea{width:100%;height:80px;font:15px/1.5 sans-serif;border:1px solid var(--bd);background:var(--bg);color:var(--fg);border-radius:6px;padding:6px}#ed .q{color:var(--mu);font-size:13px;max-height:3em;overflow:hidden;margin-bottom:6px}
#fb{position:fixed;display:none;z-index:8;background:var(--ac);color:#fff;border:0;padding:8px 16px;border-radius:20px;box-shadow:0 3px 10px #0004;font-family:sans-serif}
#tg{display:none}#df{max-width:760px;margin:16px auto 0;padding:0 20px;font-family:sans-serif;font-size:14px}#df details{border:1px solid var(--bd);border-radius:8px;padding:8px 12px;background:var(--card)}#df .pr{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0;border-top:1px dashed var(--bd);padding-top:8px}#df .b4{color:var(--mu);text-decoration:line-through;text-decoration-color:#c0392b80}#df .af{color:var(--fg)}#df .mt{color:var(--mu);font-size:12px}@media(max-width:600px){#df .pr{grid-template-columns:1fr}}#meta{color:var(--mu);font-size:12px}.big{background:var(--ac);color:#fff;border-color:var(--ac);font-size:15px;padding:7px 16px;font-weight:600}
.dec{margin:0 0 1.1em;padding:10px 12px;border:1px dashed var(--ac);border-radius:8px;background:var(--card);font-family:sans-serif;font-size:14px;text-indent:0;text-align:left}
.dec .dec-lab{color:var(--ac);font-weight:600;margin-bottom:6px;font-size:13px}
.dec .dec-opts{display:flex;flex-wrap:wrap;gap:8px 14px}
.dec label{display:inline-flex;align-items:center;gap:4px;cursor:pointer;color:var(--fg);padding:2px 0}
.dec input[type=radio]{accent-color:var(--ac);margin:0}
.dec .dec-rec{font-size:12px;color:var(--fg);opacity:.8;margin:2px 0 6px}.dec .rec-tag{color:var(--ac);font-size:11px;margin-left:2px}.dec .dec-vote{margin-top:8px;font-size:12px;border-top:1px dotted var(--ac);padding-top:6px}.dec .dec-vote div{margin:2px 0}
#chgbar{display:none;position:sticky;top:41px;z-index:4;max-width:760px;margin:0 auto;padding:6px 20px;background:var(--hd);border-bottom:1px solid var(--bd);font-family:sans-serif;font-size:13px;align-items:center;gap:8px;flex-wrap:wrap}#chgbar.show{display:flex}#chgbar b{color:var(--chg-bd);font-weight:600}#chgbar button{font:inherit;font-size:12px;padding:3px 10px}#decbar{max-width:760px;margin:10px auto 0;padding:0 20px;font-family:sans-serif;font-size:13px;color:var(--mu)}
#decbar b{color:var(--ac);font-weight:600}
del.dd{background:#fbd5d0;color:#a12a1c;text-decoration:line-through;text-decoration-color:#c0392b}ins.di{background:#cdeed6;color:#1d6b35;text-decoration:none}
:root[data-theme=dark] del.dd{background:#5a2620;color:#f3b3a9}:root[data-theme=dark] ins.di{background:#1f4a2c;color:#a6e3b5}@media(prefers-color-scheme:dark){:root:not([data-theme=light]) del.dd{background:#5a2620;color:#f3b3a9}:root:not([data-theme=light]) ins.di{background:#1f4a2c;color:#a6e3b5}}
body:not(.cmp) .tx-d,body.cmp .tx-n{display:none}body:not(.cmp) .delp{display:none}p .chg-badge{cursor:pointer}
.delp{margin:0 0 .9em;padding:6px 10px;border-radius:4px;background:#fbd5d0;color:#a12a1c;font-size:15px;line-height:1.8;font-family:sans-serif;border-left:3px solid #c0392b}.delp s{text-decoration-color:#c0392b}.delp .dl{font-size:11px;font-weight:600;margin-right:6px}
.oldbox{margin:-.5em 0 .9em;padding:6px 10px;border:1px dashed var(--bd);border-radius:4px;background:var(--card);color:var(--mu);font-size:15px;line-height:1.8;font-family:sans-serif}.oldbox .dl{font-size:11px;font-weight:600;margin-right:6px;color:var(--fg)}
.dec .dec-done{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;margin-top:4px;font-size:14px}
.dec .dec-act{margin-top:8px}
.dec .dec-btn{font:inherit;font-size:13px;padding:3px 12px;border:1px solid var(--bd);background:var(--card);border-radius:6px;cursor:pointer;color:var(--fg)}
.dec .dec-cfm{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
#cbx{position:fixed;inset:20% 5% auto 5%;height:50%;z-index:20;display:none;width:90%;font:14px/1.5 sans-serif;background:var(--card);color:var(--fg);border:2px solid var(--ac);border-radius:8px;padding:8px}
@media(max-width:600px){#xm,#xj,#cp,#sub,#meta{display:none}.big{font-size:14px;padding:6px 10px}}
@media(max-width:900px){aside{display:none;position:fixed;inset:45px 0 0 0;width:auto;height:auto;background:var(--bg);z-index:6}aside.open{display:block}#tg{display:inline}p .n{position:static;display:inline-block;width:auto;margin-right:.4em}p .chg-badge{position:static;display:inline-block;margin:0 .35em 0 0;vertical-align:middle}p{font-size:17px;text-indent:0}header{padding:8px}}
p .eb{position:absolute;right:-3.4em;top:.35em;text-indent:0;font:11px/1 sans-serif;padding:3px 6px;opacity:.55}p:hover .eb,p.aedit .eb{opacity:1}p.aedit{box-shadow:inset -3px 0 0 #2f6fd0;background:#e8f0fd}:root[data-theme=dark] p.aedit{background:#1d2a3e}
#aed{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(680px,94vw);background:var(--card);border:2px solid #2f6fd0;border-radius:10px;box-shadow:0 6px 24px #0006;padding:12px;display:none;z-index:30;font-family:sans-serif}#aed textarea{width:100%;height:220px;font:17px/1.8 serif;border:1px solid var(--bd);background:var(--bg);color:var(--fg);border-radius:6px;padding:8px}#aed .q{color:var(--mu);font-size:13px;max-height:6em;overflow:auto;margin:6px 0;border-left:3px solid var(--bd);padding-left:6px}
