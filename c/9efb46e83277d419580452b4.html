<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>细纲审阅</title><meta name="robots" content="noindex">
<script>(function(){var d=document.documentElement,m=localStorage.getItem('rv-theme');if(m)d.dataset.theme=m})()</script>
<style>
:root{--bg:#faf8f3;--fg:#2b2b2b;--mu:#7a756c;--ac:#c0392b;--card:#fffdf8;--bd:#e6e0d4;--hd:#fffdf8ee;--g:#2e8b57;--y:#d35400;--r:#c0392b;--hl:#fff1b8;--hv:#f1ece2;--gbg:#eaf6ef;--ybg:#fdf3e8;--rbg:#fceeed}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1c1e;--fg:#d8d4cc;--mu:#8a8680;--ac:#e0705f;--card:#242528;--bd:#34353a;--hd:#1b1c1eee;--hl:#4a4020;--hv:#26272a;--gbg:#1e2a22;--ybg:#2a2418;--rbg:#2a1e1e}}
:root[data-theme=dark]{--bg:#1b1c1e;--fg:#d8d4cc;--mu:#8a8680;--ac:#e0705f;--card:#242528;--bd:#34353a;--hd:#1b1c1eee;--hl:#4a4020;--hv:#26272a;--gbg:#1e2a22;--ybg:#2a2418;--rbg:#2a1e1e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 "PingFang SC","Noto Sans CJK SC","Source Han Sans SC",sans-serif}
header{position:sticky;top:0;background:var(--hd);border-bottom:1px solid var(--bd);padding:8px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;z-index:5;font-size:14px}
header b{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}#st{font-size:12px;color:var(--fg)}#meta{color:var(--mu);font-size:12px}
button{font:inherit;color:var(--fg);border:1px solid var(--bd);background:var(--card);border-radius:6px;padding:6px 12px;cursor:pointer;min-height:40px}
button:disabled{opacity:.45;cursor:not-allowed}.big{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
a{color:var(--ac)}.wrap{max-width:820px;margin:0 auto;padding:16px 18px 130px}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.verdict{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.tag{font-size:12px;padding:2px 9px;border-radius:10px;color:#fff;background:var(--y)}.tag.ok{background:var(--g)}.tag.bad{background:var(--r)}.tag.mu{background:#7f8c8d}
.lamps{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.lamp{border:1px solid var(--bd);border-radius:8px;padding:6px 8px;min-width:72px;text-align:center;cursor:pointer;background:var(--bg)}
.lamp:hover,.lamp.on{border-color:var(--ac)}.lamp .n{font-size:12px;color:var(--mu)}.lamp .v{font-weight:700;font-size:16px}
.lamp.绿 .v{color:var(--g)}.lamp.黄 .v{color:var(--y)}.lamp.红 .v{color:var(--r)}
.lamp .d{font-size:11px;color:var(--mu);margin-top:2px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.issue{border-left:3px solid var(--y);padding:8px 10px;margin:8px 0;background:var(--bg);border-radius:0 8px 8px 0;cursor:pointer}
.issue.红{border-left-color:var(--r)}.issue.灰,.issue.note{border-left-color:#95a5a6;background:var(--bg)}.issue.on{outline:2px solid var(--ac)}.issue .h{font-size:12px;color:var(--ac);margin-bottom:4px}
.issue.灰 .h,.issue.note .h{color:var(--mu)}.issue .t{font-size:14px;line-height:1.55}
.issue .badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:999px;margin-right:4px;background:#eceff1;color:#546e7a}
.issue.黄 .badge{background:var(--ybg);color:var(--y)}.issue.红 .badge{background:var(--rbg);color:var(--r)}
.vers{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px;font-size:13px}
.vers a,.vers span{padding:4px 10px;border-radius:8px;border:1px solid var(--bd);text-decoration:none;color:var(--fg);background:var(--card)}
.vers .cur{border-color:var(--ac);color:var(--ac);font-weight:600}
.hint{color:var(--mu);font-size:13px;margin:6px 0 12px;line-height:1.5}
.mu{color:var(--mu)}

/* —— 段卡：灯贴段 + 可读排版 —— */
details.sec{border:1px solid var(--bd);border-left:5px solid var(--bd);border-radius:10px;margin:0 0 12px;background:var(--card);overflow:hidden}
details.sec.lamp-绿{border-left-color:var(--g);background:linear-gradient(90deg,var(--gbg) 0,var(--card) 28px)}
details.sec.lamp-黄{border-left-color:var(--y);background:linear-gradient(90deg,var(--ybg) 0,var(--card) 28px)}
details.sec.lamp-红{border-left-color:var(--r);background:linear-gradient(90deg,var(--rbg) 0,var(--card) 28px)}
details.sec.hot{box-shadow:0 0 0 1px color-mix(in srgb,var(--ac) 35%,transparent)}
details.sec.flash{outline:2px solid var(--ac);outline-offset:2px}
details.sec>summary{cursor:pointer;padding:12px 14px;font-weight:600;list-style:none;display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;line-height:1.45;font-size:15.5px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec .sid{font-size:12px;color:var(--mu);font-weight:500;min-width:1.6em;padding-top:2px}
details.sec .stitle{flex:1;min-width:12em}
.dot{display:inline-flex;align-items:center;justify-content:center;min-width:2.2em;height:1.55em;padding:0 7px;border-radius:999px;font-size:12px;font-weight:700;color:#fff;flex-shrink:0;letter-spacing:.02em}
.dot.绿{background:var(--g)}.dot.黄{background:var(--y)}.dot.红{background:var(--r)}.dot.无{background:#95a5a6;font-weight:500}
details.sec .act{margin-left:auto;font-size:12px;font-weight:500;color:var(--ac);border:1px solid var(--bd);border-radius:6px;padding:4px 10px;background:var(--bg);min-height:32px;display:inline-flex;align-items:center}
details.sec .act:hover{border-color:var(--ac)}
.seg-sum{width:100%;margin:2px 0 0;font-size:12.5px;font-weight:500;color:var(--mu);line-height:1.45}
.seg-sum.黄{color:var(--y)}.seg-sum.红{color:var(--r)}
.seg-body{padding:0 16px 16px}
.seg-issues{margin:0 0 12px;display:flex;flex-direction:column;gap:8px}
.seg-iss{border-left:3px solid var(--y);background:var(--ybg);border-radius:0 8px 8px 0;padding:8px 10px;cursor:pointer;font-size:13.5px;line-height:1.55}
.seg-iss.红{border-left-color:var(--r);background:var(--rbg)}
.seg-iss.灰,.seg-iss.note{border-left-color:#95a5a6;background:var(--bg);color:var(--mu)}
.seg-iss .ih{font-size:12px;color:var(--ac);margin-bottom:3px;font-weight:600}
.seg-iss.灰 .ih,.seg-iss.note .ih{color:var(--mu)}
.seg-iss .badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:999px;margin-right:4px;background:#eceff1;color:#546e7a}
.seg-iss.黄 .badge{background:var(--ybg);color:var(--y)}.seg-iss.红 .badge{background:var(--rbg);color:var(--r)}
.seg-iss:hover{filter:brightness(.98)}
.seg-ok{font-size:12.5px;color:var(--g);margin:0 0 10px;padding:4px 0}
.seg-sum.灰{color:var(--mu)}
.dot.灰{background:#95a5a6;font-weight:600}
.md{font-size:16.5px;line-height:1.85;color:var(--fg);max-width:40em}
.md p{margin:0 0 .85em;text-align:justify;word-break:break-word}
.md .lead{font-size:14px;color:var(--mu);margin-bottom:.9em;line-height:1.6}
.md h3,.md h4,.md h5{font-size:1.05em;margin:1em 0 .45em;line-height:1.4;font-weight:700}
.md blockquote{margin:.6em 0;padding:.4em .8em;border-left:3px solid var(--bd);color:var(--mu);background:var(--bg);border-radius:0 6px 6px 0;font-size:14.5px}
.md ul,.md ol{margin:.4em 0 .9em;padding-left:1.4em}
.md li{margin:.25em 0}
.md code{font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--bg);padding:1px 5px;border-radius:4px;border:1px solid var(--bd)}
.md .tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:.7em 0 1em;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
.md table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.55;min-width:280px}
.md th,.md td{border-bottom:1px solid var(--bd);padding:8px 10px;text-align:left;vertical-align:top}
.md th{background:var(--hv);font-weight:600;white-space:nowrap}
.md tr:last-child td{border-bottom:0}
.md hr{border:0;border-top:1px solid var(--bd);margin:1em 0}

#ed{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(560px,94vw);background:var(--card);border:1px solid var(--bd);border-radius:10px;box-shadow:0 6px 24px #0004;padding:10px;display:none;z-index:9}
#ed textarea{width:100%;height:88px;font:15px/1.5 sans-serif;border:1px solid var(--bd);background:var(--bg);color:var(--fg);border-radius:6px;padding:6px}
#ed .q{color:var(--mu);font-size:13px;max-height:3em;overflow:hidden;margin-bottom:6px}
aside#sd{position:fixed;right:0;top:52px;bottom:0;width:min(320px,92vw);border-left:1px solid var(--bd);background:var(--bg);padding:12px;overflow:auto;display:none;z-index:6}
aside#sd.open{display:block}.c{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px;margin-bottom:10px}.c .q{color:var(--mu);border-left:3px solid var(--ac);padding-left:6px;margin:4px 0;font-size:12px}.c .h{color:var(--ac);font-size:12px;cursor:pointer}
#cbx{position:fixed;inset:20% 5% auto;height:50%;z-index:20;display:none;width:90%;font:14px/1.5 sans-serif;background:var(--card);color:var(--fg);border:2px solid var(--ac);border-radius:8px;padding:8px}
#gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center}
#gate form{width:min(340px,90vw);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:20px}
#gate input[type=password]{width:100%;font-size:16px;padding:8px;margin:8px 0;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg)}

.glossary{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:13.5px;line-height:1.55}
.glossary summary{cursor:pointer;font-weight:700;list-style:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.glossary summary::-webkit-details-marker{display:none}
.glossary .gbody{margin-top:10px;display:grid;gap:8px}
.glossary .grow{display:grid;grid-template-columns:5.5em 1fr;gap:8px;padding:6px 8px;background:var(--bg);border-radius:8px;border-left:3px solid var(--bd)}
.glossary .gk{font-weight:700;color:var(--ac)}
.glossary .gv{color:var(--fg)}
.chpill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:#eef5ff;color:#1a5276;border:1px solid #c5d8ef;flex-shrink:0;white-space:nowrap}
:root[data-theme=dark] .chpill{background:#1a2836;color:#9ec5e8;border-color:#2a4058}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .chpill{background:#1a2836;color:#9ec5e8;border-color:#2a4058}}
.rolepill{font-size:11px;font-weight:600;padding:1px 7px;border-radius:6px;background:var(--hv);color:var(--mu);border:1px solid var(--bd);flex-shrink:0}
.rolepill.seg,.rolepill.subseg{color:#1a5276;background:#eef5ff;border-color:#c5d8ef}
:root[data-theme=dark] .rolepill.seg,:root[data-theme=dark] .rolepill.subseg{color:#9ec5e8;background:#1a2836;border-color:#2a4058}
.lamp .ch{font-size:11px;color:#1a5276;font-weight:600;margin-top:2px}
.rhypill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;flex-shrink:0;letter-spacing:.02em;border:1px solid var(--bd)}
.rhypill.press{background:#fde8e6;color:#a93226;border-color:#f5c6c0}
.rhypill.breath{background:#eafaf1;color:#1e8449;border-color:#a9dfbf}
.rhypill.repress{background:#f5eef8;color:#6c3483;border-color:#d2b4de}
.rhypill.group{background:var(--hv);color:var(--mu)}
:root[data-theme=dark] .rhypill.press{background:#3a1e1c;color:#f5b7b1;border-color:#5d2c28}
:root[data-theme=dark] .rhypill.breath{background:#1a2e22;color:#a9dfbf;border-color:#2a4a35}
:root[data-theme=dark] .rhypill.repress{background:#2a1e33;color:#d2b4de;border-color:#4a3560}
details.sec.seg-group{border-style:dashed;opacity:.92}
details.sec.seg-group>summary{font-weight:600;background:var(--bg)}
details.sec.subseg{box-shadow:0 1px 0 color-mix(in srgb,var(--bd) 80%,transparent)}
.serial-strip{margin:0 0 14px;padding:10px 12px;border:1px dashed var(--bd);border-radius:10px;background:var(--bg)}
.serial-strip .sh{font-size:12px;font-weight:700;color:var(--mu);margin-bottom:6px}
.serial-strip .srow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:5px 0;border-top:1px solid var(--bd);font-size:13.5px;line-height:1.4;cursor:pointer}
.serial-strip .srow:first-of-type{border-top:0}
.serial-strip .srow:hover{color:var(--ac)}
.serial-strip .ord{font-size:11px;font-weight:700;color:var(--mu);min-width:1.6em}
.serial-strip .span{font-weight:700;color:#1a5276}
:root[data-theme=dark] .serial-strip .span{color:#9ec5e8}

.taskline{width:100%;margin:4px 0 0;font-size:13px;font-weight:500;color:var(--fg);line-height:1.45;padding:4px 8px;background:var(--bg);border-radius:6px;border-left:3px solid var(--ac)}
.taskline .tk{color:var(--mu);font-size:11px;font-weight:700;margin-right:6px}
.rhythm-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 4px;font-size:12.5px;color:var(--mu)}
.seg-group-note{font-size:12.5px;color:var(--mu);margin:0 0 10px;line-height:1.5;padding:6px 8px;background:var(--bg);border-radius:6px}

:root[data-theme=dark] .lamp .ch{color:#9ec5e8}

@media(max-width:700px){
  header{padding:8px}.wrap{padding:10px 10px 130px}button.big{padding:6px 10px}
  details.sec>summary{padding:10px 12px;font-size:15px}
  .dot{min-width:2em}
  .seg-body{padding:0 12px 14px}
  .md{font-size:15.5px;line-height:1.8}
  .md th,.md td{padding:7px 8px;font-size:13.5px}
  details.sec .act{padding:4px 8px}
}
</style></head><body>
<header>
  <a href="../index.html" style="text-decoration:none;color:var(--mu)">← 目录</a>
  <b id="hdt">细纲审阅</b>
  <span id="meta"></span>
  <span id="st"></span>
  <button id="rj" class="big">打回</button>
  <button id="sub">提交批注</button>
  <button id="cp">复制全部批注</button>
  <button id="tg">批注</button>
  <button id="th" title="浅色/深色">◐</button>
</header>
<div class="wrap" id="app"></div>
<aside id="sd"></aside>
<div id="ed"><div class="q" id="eq"></div><textarea id="et" placeholder="写批注…（Ctrl+Enter 保存）"></textarea><div style="text-align:right;margin-top:6px"><button id="ec">取消</button> <button id="es" style="background:var(--ac);color:#fff;border-color:var(--ac)">保存</button></div></div>
<textarea id="cbx" readonly></textarea>
<div id="gate"><form id="gf"><div>请输入阅读密码</div><input id="gp" type="password" autocomplete="current-password"><label style="font-size:14px;display:block;margin:8px 0"><input type="checkbox" id="gr"> 记住密码（仅本机）</label><button style="width:100%;background:var(--ac);color:#fff;border:0;padding:8px;border-radius:6px">打开</button><div id="gm" style="color:var(--ac);font-size:13px;margin-top:6px"></div></form></div>

/* 轻量 md：表／段／粗斜体／引用；结构文可读，非小说正文 */
function inlineMd(s){
  let t=esc(s);
  t=t.replace(/`([^`]+)`/g,'<code>$1</code>');
  t=t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  t=t.replace(/(^|[^*])\*([^*]+)\*(?![*])/g,function(_,a,b){return a+'<em>'+b+'</em>'});
  return t;
}
function isSepRow(cells){return cells.length>=2 && cells.every(c=>/^:?-{3,}:?$/.test(c.trim()))}
function renderTable(rows){
  if(rows.length<2) return '<p>'+rows.map(r=>inlineMd(r.join('｜'))).join('<br>')+'</p>';
  let i=0, head=rows[0];
  if(rows[1] && isSepRow(rows[1])) i=2; else i=1;
  let h='<div class="tbl-wrap"><table><thead><tr>'+head.map(c=>'<th>'+inlineMd(c)+'</th>').join('')+'</tr></thead><tbody>';
  for(;i<rows.length;i++){
    let cells=rows[i];
    while(cells.length<head.length) cells.push('');
    h+='<tr>'+cells.slice(0,head.length).map(c=>'<td>'+inlineMd(c)+'</td>').join('')+'</tr>';
  }
  return h+'</tbody></table></div>';
}
function parseTableLine(ln){
  let s=ln.trim();
  if(!s.startsWith('|')) return null;
  let parts=s.split('|');
  if(parts[0].trim()==='') parts=parts.slice(1);
  if(parts.length && parts[parts.length-1].trim()==='') parts=parts.slice(0,-1);
  if(parts.length<2) return null;
  return parts.map(x=>x.trim());
}
function mdToHtml(raw){
  let lines=String(raw||'').replace(/\r\n?/g,'\n').split('\n');
  // 去掉与 summary 重复的首行标题
  if(lines.length && /^#{2,4}\s+/.test(lines[0])) lines=lines.slice(1);
  while(lines.length && !lines[0].trim()) lines=lines.slice(1);
  let out=[], i=0, para=[];
  const flushP=()=>{if(!para.length)return; out.push('<p>'+inlineMd(para.join(' ')).replace(/  /g,' ')+'</p>'); para=[]};
  while(i<lines.length){
    let ln=lines[i], t=ln.trim();
    if(!t){ flushP(); i++; continue; }
    let cells=parseTableLine(ln);
    if(cells){
      flushP();
      let rows=[cells]; i++;
      while(i<lines.length){
        let c2=parseTableLine(lines[i]);
        if(!c2) break;
        rows.push(c2); i++;
      }
      out.push(renderTable(rows));
      continue;
    }
    if(/^#{2,6}\s+/.test(t)){
      flushP();
      let m=t.match(/^(#{2,6})\s+(.+)$/);
      let lv=Math.min(5, m[1].length);
      out.push('<h'+lv+'>'+inlineMd(m[2])+'</h'+lv+'>');
      i++; continue;
    }
    if(/^>\s?/.test(t)){
      flushP();
      let qs=[];
      while(i<lines.length && /^>\s?/.test(lines[i].trim())){
        qs.push(lines[i].trim().replace(/^>\s?/,'')); i++;
      }
      out.push('<blockquote>'+qs.map(inlineMd).join('<br>')+'</blockquote>');
      continue;
    }
    if(/^(-{3,}|\*{3,}|_{3,})\s*$/.test(t)){ flushP(); out.push('<hr>'); i++; continue; }
    if(/^[-*+]\s+/.test(t) || /^\d+\.\s+/.test(t)){
      flushP();
      let ol=/^\d+\.\s+/.test(t), items=[];
      while(i<lines.length){
        let tt=lines[i].trim();
        if(ol){ if(!/^\d+\.\s+/.test(tt)) break; items.push(tt.replace(/^\d+\.\s+/,'')); }
        else { if(!/^[-*+]\s+/.test(tt)) break; items.push(tt.replace(/^[-*+]\s+/,'')); }
        i++;
      }
      out.push('<'+(ol?'ol':'ul')+'>'+items.map(x=>'<li>'+inlineMd(x)+'</li>').join('')+'</'+(ol?'ol':'ul')+'>');
      continue;
    }
    para.push(t); i++;
  }
  flushP();
  return out.join('') || '<p class="lead">（本段无正文）</p>';
}

function issuesOf(sid, issues){

function isSoftIssue(Q){
  if(!Q) return false;
  if(Q.soft===true) return true;
  let lv=String(Q.level||'').toLowerCase();
  if(lv==='note'||lv==='soft'||lv==='risk'||lv==='风险点') return true;
  if(Q.lamp==='灰'||Q.lamp==='备注'||Q.lamp==='提示') return true;
  let t=String(Q.text||'');
  return t.indexOf('不构成不过')>=0 || t.indexOf('低风险')>=0;
}
function issueKind(Q){
  if(isSoftIssue(Q)) return '灰';
  return (Q&&(Q.lamp==='红'||Q.lamp==='黄')) ? Q.lamp : '黄';
}
function issueBadge(Q){
  if(isSoftIssue(Q)) return '风险点';
  let k=issueKind(Q);
  return k==='红'?'红问题':(k==='黄'?'黄问题':'问题');
}
function realIssues(issues){ return (issues||[]).filter(x=>!isSoftIssue(x) && (x.lamp==='黄'||x.lamp==='红'||issueKind(x)==='黄'||issueKind(x)==='红')); }
function softIssues(issues){ return (issues||[]).filter(x=>isSoftIssue(x)); }

function jumpSeg(sid){
  let el=document.querySelector('details.sec[data-seg="'+CSS.escape(String(sid))+'"]');
  if(!el) return;
  el.open=true;
  el.classList.add('flash');
  el.scrollIntoView({behavior:'smooth',block:'start'});
  setTimeout(()=>el.classList.remove('flash'),1600);
}


function glossaryHtml(){
  return '<details class="glossary" open><summary>术语定义 <span class="mu" style="font-weight:500">（细纲页专用｜点收起）</span></summary><div class="gbody">'
    +'<div class="grow"><div class="gk">章 chN</div><div class="gv">细纲里的<strong>章节</strong>（ch1／ch2／ch3…）。页上每章一张组卡，下挂章骨与各拍。必须看得见 chN。</div></div>'
    +'<div class="grow"><div class="gk">拍／场景</div><div class="gv">本页「拍」＝细纲场号（如 <strong>1.1／2.3</strong>），即一场戏／时空连续单位（含软场景／续场／钩）。<strong>不是</strong>结构段 1／2／3a，也<strong>不是</strong>正文自然段。</div></div>'
    +'<div class="grow"><div class="gk">章骨</div><div class="gv">每章五项接口（接钩／代价／转折／章末钩／情绪曲线）。批注可挂章骨，冷读灯通常贴拍。</div></div>'
    +'<div class="grow"><div class="gk">节拍</div><div class="gv">价值转换的<strong>最小戏剧单位</strong>（斯温·麦基）。一场拍里可有多拍；冷读灯默认贴<strong>场号</strong>，除非 JSON 显式标更细。</div></div>'
    +'<div class="grow"><div class="gk">相对结构</div><div class="gv">细纲对齐现行结构（如 S1.3）。本页<strong>不改 STRUCTURE</strong>；结构问题回结构页批。</div></div>'
    +'<div class="grow"><div class="gk">灯＋问题</div><div class="gv"><strong>绿</strong>＝无真黄／红。<strong>黄／红</strong>＝真问题。<strong>灰「风险点」</strong>＝软注，不抬灯。冷读闸＝<strong>2＋2 并发取严</strong>。</div></div>'
    +'</div></details>';
}
function chLabel(S){
  if(S&&S.chLabel) return S.chLabel;
  let cs=S&&S.chSpan; if(!cs||!cs.label) return '';
  return cs.label;
}
function rhythmClass(role){
  if(role==='加压') return 'press';
  if(role==='换气提气') return 'breath';
  if(role==='再加压') return 'repress';
  if(role&&role.indexOf('→')>=0) return 'group';
  return '';
}
function lampLabel(L){
  let id=String(L.id||'');
  if(/^ch\d+$/i.test(id)) return id;
  if(/^\d+\.\d+$/.test(id)) return '拍 '+id;
  if(/^bone-/.test(id)) return '章骨';
  return id || '单元';
}
function segTag(S){
  if(!S) return '单元';
  if(S.tag) return S.tag;
  if(S.role==='chapter') return '章';
  if(S.role==='scene') return '拍／场景';
  if(S.role==='bone') return '章骨';
  if(S.role==='meta') return '说明块';
  return '单元';
}


function serialStripHtml(secs,lamps){
  const chs=secs.filter(x=>x.role==='chapter');
  if(!chs.length) return '';
  const rows=chs.map((S,i)=>{
    let id=String(S.id);
    let L=lampOf(id,lamps); let lamp=L?L.lamp:'—';
    let scenes=secs.filter(x=>x.role==='scene' && x.chN===S.chN);
    let bad=scenes.filter(sc=>{let L2=lampOf(sc.id,lamps); return L2 && (L2.lamp==='黄'||L2.lamp==='红')}).length;
    return '<div class="srow" data-seg="'+esc(id)+'"><span class="ord">'+(i+1)+'</span><span class="dot '+(lamp||'无')+'">'+(lamp||'—')+'</span><b>'+esc(S.chLabel||id)+'</b><span class="span">'+esc((S.label||'').replace(/^ch\d+[｜|]?/,'').slice(0,24))+'</span><span class="mu">'+scenes.length+' 拍'+(bad?(' · 黄红 '+bad):'')+'</span></div>';
  });
  return '<div class="serial-strip"><div class="sh">章导航（点跳｜下挂拍／场景）</div>'+rows.join('')+'</div>';
}

function render(){
  const C=P.coldread||{},lamps=C.lamps||[],issues=C.issues||[],secs=P.sections||[];
  let vtag=C.verdict==='过'?'ok':(C.verdict?'bad':'mu');
  let h='';
  let vers=P.versions||[];
  h+=glossaryHtml();
  if(vers.length||P.diffFrom){
    h+='<div class="vers"><span class="mu">历史版本</span>';
    vers.forEach(v=>{
      if(v.current) h+='<span class="cur">'+esc(v.label||v.ch)+'</span>';
      else if(v.href) h+='<a href="'+esc(v.href)+'">'+esc(v.label||v.ch)+'</a>';
      else h+='<span>'+esc(v.label||v.ch)+'</span>';
    });
    if(P.diffFrom) h+='<span class="mu">'+esc(P.diffFrom)+'</span>';
    h+='</div>';
  }
  h+='<div class="panel"><div class="verdict"><b>取严结论</b>';
  h+='<span class="tag '+vtag+'">'+esc(C.verdict||'无')+'</span>';
  h+='<span class="tag mu">签约 '+esc(C.sign||'—')+'</span>';
  h+='<span class="tag mu">追读 '+esc(C.follow||'—')+'</span>';
  if(C.gptPass!=null) h+='<span class="tag '+(C.gptPass?'ok':'bad')+'">GPT '+(C.gptPass?'过':'不过')+'</span>';
  if(C.grokPass!=null) h+='<span class="tag '+(C.grokPass?'ok':'bad')+'">Grok '+(C.grokPass?'过':'不过')+'</span>';
  h+='</div><div class="hint">'+esc(C.note||'')+(C.source?(' · 来源 '+C.source):'')+' · 指纹 '+esc(P.fp)+' · 状态 '+esc(P.status||'')+'</div>';
  h+='<div><b>灯表</b>（冷读贴<strong>章／拍</strong>；点灯跳到该结构段，旁有灯＋问题＋chN）</div><div class="hint">黄卡／红卡＝构成该段黄／红灯的真问题；<strong>灰「风险点」</strong>＝低风险备注，不至于黄、不抬段灯。</div><div class="lamps">';
  lamps.forEach(L=>{
    let S=secs.find(x=>String(x.id)===String(L.id));
    let ch=chLabel(S);
    h+='<div class="lamp '+esc(L.lamp)+'" data-seg="'+esc(L.id)+'" title="跳到 '+esc(lampLabel(L))+(ch?(' · '+ch):'')+'"><div class="n">'+esc(lampLabel(L))+'</div><div class="v">'+esc(L.lamp)+'</div>'+(ch?'<div class="ch">'+esc(ch)+'</div>':'')+'<div class="d">'+esc(L.delta||L.label||'')+'</div></div>';
  });
  h+='</div></div>';
  h+='<div class="panel"><b>黄／红问题</b><div class="hint">仅<strong>真黄／红</strong>。点卡片跳到对应<strong>章／拍</strong>并写批；批完团队再改细纲，本页不改正文、不代签。软注见下方「风险点」。冷读闸＝2＋2 取严。</div>';
  let bad=realIssues(issues);
  bad.forEach(Q=>{
    let S=secs.find(x=>String(x.id)===String(Q.seg||''));
    let ch=chLabel(S);
    let segLab=lampLabel({id:String(Q.seg||'?')});
    let kind=issueKind(Q);
    h+='<div class="issue '+esc(kind)+'" data-seg="'+esc(Q.seg||'')+'" data-qid="'+esc(Q.id||'')+'"><div class="h"><span class="badge">'+esc(issueBadge(Q))+'</span>'+esc(Q.id||'')+' · '+esc(segLab)+(ch?(' · '+esc(ch)):'')+' · '+esc(kind)+'</div><div class="t">'+esc(Q.text||'')+'</div></div>';
  });
  if(!bad.length) h+='<div class="hint">无真黄／红问题卡</div>';
  let softs=softIssues(issues);
  if(softs.length){
    h+='<div style="margin-top:12px"><b>风险点</b><span class="mu" style="font-size:12px;font-weight:500">（灰｜不至于黄｜不抬段灯）</span></div>';
    softs.forEach(Q=>{
      let S=secs.find(x=>String(x.id)===String(Q.seg||''));
      let ch=chLabel(S);
      let segLab=lampLabel({id:String(Q.seg||'?')});
      h+='<div class="issue 灰" data-seg="'+esc(Q.seg||'')+'" data-qid="'+esc(Q.id||'')+'"><div class="h"><span class="badge">风险点</span>'+esc(Q.id||'')+' · '+esc(segLab)+(ch?(' · '+esc(ch)):'')+'</div><div class="t">'+esc(Q.text||'')+'</div></div>';
    });
  }
  if(!issues.length) h+='<div class="hint">无问题卡（冷读包空或未挂）</div>';
  h+='</div>';
  h+='<div class="panel"><b>细纲正文</b><div class="hint">按 <strong>chN</strong> 展开；下挂<strong>章骨</strong>与<strong>拍／场景</strong>（场号如 1.1）。灯贴拍；灰「风险点」不抬灯。点「批」按章或拍批注。</div>';
  h+=serialStripHtml(secs,lamps);
  const hot=new Set((lamps.filter(x=>x.lamp==='黄'||x.lamp==='红').map(x=>String(x.id))).concat(realIssues(issues).map(x=>String(x.seg||''))));
  secs.forEach(S=>{
    let L=lampOf(S.id,lamps);
    let lamp=L?L.lamp:'';
    let iss=issuesOf(S.id,issues);
    let real=iss.filter(x=>!isSoftIssue(x));
    let soft=iss.filter(x=>isSoftIssue(x));
    let isGroup=S.role==='chapter';
    let isSub=S.role==='scene';
    let isBone=S.role==='bone';
    let open=hot.has(String(S.id)) || (isSub && hot.has('ch'+String(S.chN||''))) || (isGroup && String(S.id)==='ch1');
    let cls='sec'+(lamp?(' lamp-'+lamp):'')+(hot.has(String(S.id))?' hot':'')+(isGroup?' seg-group':'')+(isSub?' subseg':'');
    let ch=chLabel(S);
    let tag=segTag(S);
    let role=S.role||'';
    let rhy=S.rhythmRole||'';
    let rhyCls=rhythmClass(rhy);
    let task=S.readerTask||'';
    let sumLine='';
    if(isGroup){
      let nScene=(secs.filter(x=>x.role==='scene'&&x.chN===S.chN)||[]).length;
      sumLine='<div class="seg-sum">章总览｜下挂章骨＋'+nScene+' 拍 · '+esc(ch||'')+'</div>';
    } else if(real.length){
      let first=real[0]; let kind=issueKind(first);
      sumLine='<div class="seg-sum '+esc(kind)+'">'+esc(kind)+' · '+esc((first.text||'').slice(0,72))+( (first.text||'').length>72?'…':'')+(real.length>1?(' 等 '+real.length+' 条'):'')+'</div>';
    } else if(soft.length && lamp==='绿'){
      sumLine='<div class="seg-sum 灰">绿灯 · 风险点 '+soft.length+' 条（不抬灯）</div>';
    } else if(soft.length){
      sumLine='<div class="seg-sum 灰">风险点 '+soft.length+' 条（不抬灯）</div>';
    } else if(lamp==='绿'){
      sumLine='<div class="seg-sum">绿灯 · 本单元无贴段问题</div>';
    }
    if(task && !isGroup){
      sumLine+='<div class="taskline"><span class="tk">读者任务</span>'+esc(task)+'</div>';
    }
    let sceneBadge=S.sceneType?'<span class="rolepill">'+esc(S.sceneType)+'</span>':(S.hasScene?'<span class="rolepill">场景</span>':'');
    let rhyBadge=rhy?'<span class="rhypill '+rhyCls+'" title="节奏角色">'+esc(rhy)+'</span>':'';
    h+='<details class="'+cls+'" '+(open?'open':'')+' data-seg="'+esc(S.id)+'">';
    h+='<summary>';
    h+='<span class="dot '+(lamp||'无')+'">'+(lamp||'—')+'</span>';
    h+='<span class="rolepill '+esc(role)+'">'+esc(tag)+'</span>';
    h+=rhyBadge;
    if(ch) h+='<span class="chpill" title="建议章跨（示意，不锁死）">'+esc(ch)+'</span>';
    h+='<span class="sid">'+esc(S.id)+'</span>';
    h+=sceneBadge;
    let titleShow=S.label||'';
    if(isSub){
      let st=S.sceneType?('｜'+S.sceneType):'';
      let bud=S.budget?('｜约'+S.budget+'字'):'';
      titleShow=String(S.id)+' '+esc(ch||'')+st+bud;
      titleShow=String(S.id)+(ch?(' · '+ch):'')+(S.sceneType?('｜'+S.sceneType):'')+(S.budget?('｜约'+S.budget+'字'):'');
    }
    if(isGroup) titleShow=(S.chLabel||S.id)+'｜'+(S.label||'').replace(/^ch\d+[｜|]?\s*/,'');
    h+='<span class="stitle">'+esc(titleShow)+'</span>';
    if(isSub && S.label) h+='<span class="mu" style="font-size:12px;font-weight:500;width:100%">'+esc(S.label)+'</span>';
    h+='<span class="act" data-bat="1">批</span>'+sumLine+'</summary>';
    h+='<div class="seg-body">';
    if(isGroup){
      h+='<div class="seg-group-note">这是<strong>'+esc(ch||'本章')+' 组头</strong>。请看下方<strong>章骨</strong>与各<strong>拍／场景</strong>。灯／问题以拍为准。</div>';
    }
    if(real.length || soft.length){
      h+='<div class="seg-issues">';
      real.forEach(Q=>{
        let sl=lampLabel({id:String(Q.seg||S.id)});
        let kind=issueKind(Q);
        h+='<div class="seg-iss '+esc(kind)+'" data-seg="'+esc(Q.seg||S.id)+'" data-qid="'+esc(Q.id||'')+'"><div class="ih"><span class="badge">'+esc(issueBadge(Q))+'</span>'+esc(Q.id||'')+' · '+esc(sl)+(ch?(' · '+esc(ch)):'')+' · '+esc(kind)+'</div><div>'+esc(Q.text||'')+'</div></div>';
      });
      soft.forEach(Q=>{
        let sl=lampLabel({id:String(Q.seg||S.id)});
        h+='<div class="seg-iss 灰" data-seg="'+esc(Q.seg||S.id)+'" data-qid="'+esc(Q.id||'')+'"><div class="ih"><span class="badge">风险点</span>'+esc(Q.id||'')+' · '+esc(sl)+(ch?(' · '+esc(ch)):'')+' · 不抬灯</div><div>'+esc(Q.text||'')+'</div></div>';
      });
      h+='</div>';
    } else if(lamp==='绿' && !isGroup){
      h+='<div class="seg-ok">本单元绿灯 · 冷读无贴段问题</div>';
    }
    if(rhy && isSub){
      h+='<div class="rhythm-row"><span class="rhypill '+rhyCls+'">'+esc(rhy)+'</span><span>节奏角色 · 章跨 '+esc(ch||'—')+'</span></div>';
    }
    h+='<div class="md">'+mdToHtml(S.text||'')+'</div>';
    h+='</div></details>';
  });
  h+='</div>';
  if(P.hist&&Object.keys(P.hist).length){
    h+='<div class="panel"><details><summary><b>上一版正文对照</b>（'+esc(P.diffFrom||'prev')+'）</summary>';
    Object.keys(P.hist).forEach(fp=>{
      let arr=P.hist[fp]||[];
      h+='<div class="hint">指纹 '+esc(fp)+' · '+arr.length+' 块</div>';
      arr.slice(0,8).forEach((t,i)=>{h+='<details class="sec"><summary><span class="dot 无">—</span><span class="stitle">块 '+(i+1)+'</span></summary><div class="seg-body"><div class="md">'+mdToHtml(String(t).slice(0,4000))+'</div></div></details>'});
    });
    h+='</details></div>';
  }
  $('app').innerHTML=h;
  document.querySelectorAll('.lamp').forEach(el=>el.onclick=()=>{jumpSeg(el.dataset.seg); openEd(el.dataset.seg,'','单元 '+el.dataset.seg)});
  document.querySelectorAll('.issue[data-qid]').forEach(el=>{
    if(el.classList.contains('seg-iss')) return;
    el.onclick=()=>{jumpSeg(el.dataset.seg); openEd(el.dataset.seg,el.dataset.qid,(el.querySelector('.t')||el).textContent)};
  });
  document.querySelectorAll('.seg-iss').forEach(el=>el.onclick=e=>{e.stopPropagation(); openEd(el.dataset.seg,el.dataset.qid,el.textContent)});
  document.querySelectorAll('details.sec .act').forEach(el=>el.onclick=e=>{e.preventDefault();e.stopPropagation();openEd(el.closest('details').dataset.seg,'','细纲单元')});
  $('meta').textContent=(P.status||'')+' · 指纹 '+P.fp;
  paintNotes();
}
async function unlock(pw,remember){P=JSON.parse(await decText(pw,ENC));PW=pw;if(remember)localStorage.setItem('rv-pw',pw);$('gate').remove();
document.title=(P.book||'')+'·'+(P.ch||'细纲');$('hdt').textContent=(P.book||'')+' · '+(P.ch||'细纲');loadA();render()}
$('gf').onsubmit=async e=>{e.preventDefault();let m=$('gm');if(!window.crypto||!crypto.subtle){m.textContent='浏览器不支持解密（需 https）';return}m.textContent='解密中…';
try{await unlock($('gp').value,$('gr').checked)}catch(x){m.textContent='密码不对'}};
(async()=>{let h=new URLSearchParams(location.hash.slice(1)).get('k');if(h){try{await unlock(h,true);history.replaceState(null,'',location.pathname+location.search);return}catch(e){}}let s=localStorage.getItem('rv-pw');if(s){try{await unlock(s,true)}catch(e){localStorage.removeItem('rv-pw')}}})();
</script>
