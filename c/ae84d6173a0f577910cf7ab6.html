const b2u=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0)),u2b=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
async function dk(pw,salt){let k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}

<script type="text/plain" id="main">
const D=P.paras,DECS=P.decisions||[],K='rv:'+FID+':'+P.fp,DK=K+':dec',TITLE=P.title,BOOK=P.book,CH=P.ch,REPO='https://github.com/r42hgghpkz-lang/review/issues/new';let WVSEL=null,A=[],DEC={},cur=null,pend=null;const $=i=>document.getElementById(i);
const m=$('m'),sd=$('sd'),st=$('st');
function loadDec(){try{DEC=JSON.parse(localStorage.getItem(DK)||'{}')||{}}catch(e){DEC={}}
let mig=false;for(let k in DEC){if(typeof DEC[k]==='string'){DEC[k]={choice:DEC[k],confirmed:true};mig=true}}if(mig)saveDec()}
function saveDec(){try{localStorage.setItem(DK,JSON.stringify(DEC))}catch(e){}}
function apOf(d,o){let a=(d.applies||{})[o];return a&&a.apply!=null?a.apply:null}
function apHint(d,o){let a=apOf(d,o);return a==null?'⚠ 此项无落地句（编辑需补）':(a==='='?'正文不改':'将随锁定改正文为：「'+(a.length>60?a.slice(0,60)+'…':a)+'」')}
function entryOf(d){let e=DEC[d.id];if(e==null)return null;if(typeof e==='string')return{choice:e,confirmed:true};return e}
function choiceOf(d){let e=entryOf(d);return(e&&e.choice)?e.choice:(d.default||(d.options&&d.options[0])||'')}
function isConfirmed(d){let e=entryOf(d);return!!(e&&e.confirmed)}
function pendingDec(){return DECS.filter(d=>!isConfirmed(d)).length}
function confirmedDec(){return DECS.filter(d=>isConfirmed(d)).length}
const TASTE=P.taste||[];function tastePending(){return DECS.filter(d=>TASTE.includes(d.id)&&!isConfirmed(d))}
function updDecBanner(){let bar=$('decbar'),tp=tastePending();if($('lk')){$('lk').disabled=tp.length>0;$('lk').title=tp.length?'口味分歧待拍板：先在下方选定后才能锁定':''}if(!DECS.length){bar.innerHTML='';return}if(TASTE.length&&tp.length){bar.innerHTML='<b style="color:#c0392b">【待拍板】口味分歧 '+tp.length+' 项未选（'+tp.map(d=>d.label).join('、')+'），选定前不能锁定</b>';return}let p=pendingDec(),c=confirmedDec();bar.innerHTML=p?'<b>待确认 '+p+' 项</b> · 已确认 '+c+' 项 · 共 '+DECS.length+' 项；确认后随锁定/打回一并提交':'已确认 '+c+' 项 · 随锁定/打回一并提交'}
function decEl(d){let box=document.createElement('div');box.className='dec';box.dataset.id=d.id;
function paint(){box.innerHTML='';
let lab=document.createElement('div');lab.className='dec-lab';lab.textContent=(d.major?'重大决策 · ':'待决策 · ')+d.label;
let rec=document.createElement('div');rec.className='dec-rec';rec.textContent='推荐：'+(d.default||'')+(d.reason?'｜理由：'+d.reason:'');
box.append(lab,rec);
if(isConfirmed(d)){let st=document.createElement('div');st.className='dec-done';let sp=document.createElement('span');sp.textContent='已确认：'+choiceOf(d);let hn=document.createElement('div');hn.className='dec-rec dec-apply';hn.textContent=apHint(d,choiceOf(d));let btn=document.createElement('button');btn.type='button';btn.className='dec-btn';btn.textContent='改';
btn.onclick=e=>{e.stopPropagation();DEC[d.id]={choice:choiceOf(d),confirmed:false};saveDec();updDecBanner();paint()};st.append(sp,btn);box.append(st,hn)}
else{let opts=document.createElement('div');opts.className='dec-opts';let cur=choiceOf(d);
(d.options||[]).forEach(o=>{let lb=document.createElement('label');let inp=document.createElement('input');inp.type='radio';inp.name='dec-'+d.id;inp.value=o;if(cur===o)inp.checked=true;

/* 作者手动微调（2026-10-13；16:03 一体）：每段「编辑」→ 本机暂存 → 「提交微调并锁定」加密进 issue（action=微调锁定）；落稿 apply_author_edits → apply_locks */
const EK=K+':edits';let AE={};try{AE=JSON.parse(localStorage.getItem(EK)||'{}')||{}}catch(e){AE={}}let aeN=0;
function markEditsSent(edits){if(!edits)return;AESENT=Object.assign({},AESENT,edits);try{localStorage.setItem(EK+':sent',JSON.stringify({t:Date.now(),e:AESENT}))}catch(e){st.textContent='提交已打开；本机未能记录提交状态，请保留本页草稿'}}
function aeSync(){try{localStorage.setItem(EK,JSON.stringify(AE))}catch(e){st.textContent='本机存储失败：请复制改后文字，释放浏览器空间后重试';return false}let k=Object.keys(AE).length,b=$('aes'),lk=$('lk');b.style.display='none';
if(k){lk.textContent='提交微调并锁定（'+k+' 段）';lk.title='一次提交：落改 '+k+' 段并锁定'}else{lk.textContent='通过锁定';lk.title=''}
document.querySelectorAll('main p[data-n]').forEach(p=>{let n=p.dataset.n,on=n in AE,sent=on&&AESENT[n]==AE[n];p.classList.toggle('aedit',on);if(!on)p.classList.remove('aeorig');p.title='';
let x=p.querySelector('.aetx'),bd=p.querySelector('.aeb');if(on){if(!x){x=document.createElement('span');x.className='aetx';let ref=p.querySelector('.tx-o,.tx-n');(ref||p.lastChild).after(x)}x.textContent=AE[n];
if(!bd){bd=document.createElement('span');bd.className='aeb';bd.onclick=e=>{e.stopPropagation();p.classList.toggle('aeorig');aeBadge(p)};x.after(bd)}aeBadge(p,sent)}});
let u=aeUnsent(),c=$('aecnt');c.style.display=k?'inline-block':'none';c.textContent=u?'未提交改动 '+u+' 处':(k?'改动 '+k+' 处已提交·待落正文':'');c.title=u?'保存只存在本机；点「提交微调并锁定」／「打回」／「提交批注」一次带上':'';return true}
function aeUnsent(){return Object.keys(AE).filter(n=>AESENT[n]!=AE[n]).length}
function aeBadge(p,sent){let bd=p.querySelector('.aeb');if(!bd)return;let n=p.dataset.n;if(sent==null)sent=AESENT[n]==AE[n];bd.textContent=(sent?'你改的·已提交':'你改的·未提交')+(p.classList.contains('aeorig')?' · 看改后':' · 看原文');bd.title='点击切换原文／改后'}

function aeOpen(n){aeN=n;$('aen').textContent=n;$('aeo').textContent='原文：'+D[n-1];$('aet').value=AE[n]!=null?AE[n]:D[n-1];$('aed').style.display='block';$('aet').focus()}
document.querySelectorAll('main p[data-n]').forEach(p=>{let b=document.createElement('button');b.className='eb';b.textContent='编辑';b.title='作者手动微调这一段';b.onclick=e=>{e.stopPropagation();e.preventDefault();aeOpen(+p.dataset.n)};p.prepend(b)});
$('aec').onclick=()=>{$('aed').style.display='none'};
$('aer').onclick=()=>{let prior=AE[aeN];delete AE[aeN];if(!aeSync()){AE[aeN]=prior;return}$('aed').style.display='none'};
$('aeok').onclick=()=>{let v=$('aet').value.replace(/\r/g,'');if(/\n/.test(v)){if(!confirm('改后文含换行，会被合并成一段（换行删掉）。继续？'))return;v=v.replace(/\n+/g,'')}v=v.trim();
if(!v){alert('不能清空整段。要删段请写批注。');return}let prior=AE[aeN];if(v==D[aeN-1])delete AE[aeN];else AE[aeN]=v;if(!aeSync()){if(prior==null)delete AE[aeN];else AE[aeN]=prior;return}$('aed').style.display='none';st.textContent='✓ 已存本机草稿（未提交）'};

/* 20:24 D-20261013-2024-1：保存只存本机草稿，不再一保存即提交；正文显示改后。 */
/* 旧指纹草稿迁移、已生效标记；只有页眉提交动作才加密发出改动。 */
let AESENT={};try{AESENT=(JSON.parse(localStorage.getItem(EK+':sent')||'{}')||{}).e||{}}catch(e){}
let MIG=[],CF=[];
function sim(a,b){if(!a||!b)return 0;let g=s=>{let m={};for(let i=0;i<s.length-1;i++){let k=s.substr(i,2);m[k]=(m[k]||0)+1}return m},x=g(a),y=g(b),c=0,t=0;for(let k in x){t+=x[k];if(y[k])c+=Math.min(x[k],y[k])}for(let k in y)t+=y[k];return t?2*c/t:0}
function migrate(){let pre='rv:'+FID+':',H=P.hist||{};for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(!k||!k.startsWith(pre)||!k.endsWith(':edits')||k==EK)continue;let ofp=k.slice(pre.length,-6),o;try{o=JSON.parse(localStorage.getItem(k)||'{}')||{}}catch(e){continue}
let OP=H[ofp]||[];Object.keys(o).forEach(n=>{let mine=String(o[n]||'').trim();if(!mine)return;let old=OP[n-1]||'';
if(D.includes(mine)){MIG.push({from:ofp,n:D.indexOf(mine)+1,mine,st:'已生效'});return}
let hits=old?D.map((x,i)=>x==old?i:-1).filter(i=>i>=0):[];
if(hits.length==1){let m=hits[0]+1;if(AE[m]==null||AE[m]==mine){AE[m]=mine;MIG.push({from:ofp,n:m,mine,old,st:'原段未变·直接套用'})}else{CF.push({from:ofp,n:m,mine,theirs:AE[m],old,kind:'本页另有改动'});AE[m]=mine}return}
let bi=-1,bs=0;D.forEach((x,i)=>{let v=Math.max(sim(old,x),sim(mine,x)*.95);if(v>bs){bs=v;bi=i}});
if(bi<0||bs<.3){CF.push({from:ofp,n:0,mine,theirs:'',old,kind:'新版找不到对应段'});return}
let m=bi+1;CF.push({from:ofp,n:m,mine,theirs:D[bi],old,kind:'流水线改过这段'});AE[m]=mine;MIG.push({from:ofp,n:m,mine,old,st:'冲突·默认用你的'})});
try{localStorage.setItem('rv-arch:'+k+':'+Date.now(),JSON.stringify(o));localStorage.removeItem(k);i--}catch(e){}}
if(MIG.length||CF.length){try{localStorage.setItem(EK,JSON.stringify(AE));localStorage.setItem(EK+':cf',JSON.stringify(CF))}catch(e){}}
else{try{CF=JSON.parse(localStorage.getItem(EK+':cf')||'[]')||[]}catch(e){CF=[]}}}
function migBar(){let b=$('migbar');if(!b){b=document.createElement('div');b.id='migbar';$('df').before(b)}let pend=Object.keys(AE).filter(n=>AE[n]!=D[n-1]);let lost=CF.filter(c=>!c.n);
if((!pend.length&&!lost.length)||(!MIG.length&&!CF.length)){b.innerHTML='';b.style.display='none';return}b.style.display='block';
let sent=pend.filter(n=>AESENT[n]==AE[n]).length;
b.innerHTML='<b>你的改动 '+pend.length+' 段待落正文</b>'+(sent?'（其中 '+sent+' 段已提交，等流水线落稿；落稿后这里会消失、正文标「你改的·已生效」）':'')+(MIG.length?'<br>已从旧版页面救回 '+MIG.length+' 段未提交改动。':'')+' <button id="migsub" class="big">提交这些改动（加密到 GitHub）</button>';
let cfs=CF;cfs.forEach((c,j)=>{let d=document.createElement('div');d.className='cfx';d.innerHTML='<div class="mt">冲突 ¶'+(c.n||'?')+'：'+c.kind+'</div><div class="cfg"><div><b>你的改动</b><div class="t1"></div></div><div><b>新版</b><div class="t2"></div></div></div>'+(c.n?'<label><input type="radio" name="cf'+j+'" value="m" checked> 用我的（默认）</label> <label><input type="radio" name="cf'+j+'" value="t"> 用新版</label>':'<i>新版里找不到对应段：这段改动已保存在本机不会丢，请复制后用批注告诉流水线放哪</i>');d.querySelector('.t1').textContent=c.mine;d.querySelector('.t2').textContent=c.theirs||'（找不到）';
d.querySelectorAll('input').forEach(r=>r.onchange=()=>{if(r.value=='t'){delete AE[c.n]}else AE[c.n]=c.mine;aeSync()});if(c.n&&AE[c.n]==null)d.querySelector('input[value=t]').checked=true;b.append(d)});
$('migsub').onclick=()=>submit('作者改动')}
function markAuthored(){(P.authored||[]).forEach(a=>{let p=$('p'+a.n);if(!p||p.querySelector('.aut'))return;p.classList.add('authd');let t=document.createElement('span');t.className='aut';t.textContent='你改的·已生效';t.title='你改的这段已落正文并锁定（写手／改单不得改动）'+(a.old?'\n原：'+a.old:'');p.append(t)})}
function showDraftRecovery(){let pre='rv-arch:rv:'+FID+':',items=[];for(let i=0;i<localStorage.length;i++){let key=localStorage.key(i);if(!key||!key.startsWith(pre)||!key.includes(':edits:'))continue;try{let edits=JSON.parse(localStorage.getItem(key)||'{}');if(Object.keys(edits).length)items.push({key,edits})}catch(e){}}
let box=$('draft-recovery');if(!items.length)return;box.style.display='block';let details=document.createElement('details'),summary=document.createElement('summary');summary.textContent='旧版草稿存档 '+items.length+' 份（点开找回／复制）';details.append(summary);
items.forEach(({key,edits})=>{let d=document.createElement('div');d.className='entry';let fp=key.slice(pre.length).split(':edits:')[0];let b=document.createElement('b');b.textContent='旧指纹 '+fp+' · '+Object.keys(edits).length+' 段';d.append(b);Object.keys(edits).sort((a,b)=>+a-+b).forEach(n=>{let row=document.createElement('div');row.textContent='¶'+n+' '+edits[n];d.append(row)});let btn=document.createElement('button');btn.type='button';btn.textContent='下载这份草稿 JSON';btn.onclick=()=>dl('作者草稿-'+FID+'-'+fp+'.json',JSON.stringify({fid:FID,fp,edits},null,2),'application/json');d.append(btn);details.append(d)});box.append(details)}
migrate();Object.keys(AE).forEach(n=>{if(AE[n]==D[n-1])delete AE[n]});
