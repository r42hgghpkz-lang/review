items.forEach(({key,edits})=>{let d=document.createElement('div');d.className='entry';let fp=key.slice(pre.length).split(':edits:')[0];let b=document.createElement('b');b.textContent='旧指纹 '+fp+' · '+Object.keys(edits).length+' 段';d.append(b);Object.keys(edits).sort((a,b)=>+a-+b).forEach(n=>{let row=document.createElement('div');row.textContent='¶'+n+' '+edits[n];d.append(row)});let btn=document.createElement('button');btn.type='button';btn.textContent='下载这份草稿 JSON';btn.onclick=()=>dl('作者草稿-'+FID+'-'+fp+'.json',JSON.stringify({fid:FID,fp,edits},null,2),'application/json');d.append(btn);details.append(d)});box.append(details)}
migrate();Object.keys(AE).forEach(n=>{if(AE[n]==D[n-1])delete AE[n]});
const _aeS=aeSync;aeSync=function(){let ok=_aeS();if(ok)migBar();return ok};
markAuthored();
showDraftRecovery();aeSync();
polishBar();
/* 复盘追问单（通用，按轮）：P.debrief=[{round,file,qs,answered?}]；未答轮可提交，已答轮只读 */
function debriefBox(){const R=P.debrief||[];if(!R.length)return;const E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const box=document.createElement('section');box.id='debrief';box.style.cssText='max-width:900px;margin:12px auto;padding:10px 14px;border:2px solid var(--ac,#e0705f);border-radius:10px;background:var(--card,#242528)';
const pend=R.find(r=>!r.answered);let h='<div style="font-size:18px;font-weight:bold;color:var(--ac,#e0705f)">复盘'+(pend?' · 第'+pend.round+'轮待你回答（'+pend.qs.length+' 问）':' · 各轮已答（只读）')+'</div>';
R.slice().reverse().forEach(r=>{const live=!r.answered&&!P.readOnly,sentK='rv-debrief-sent:'+FID+':'+r.file,A=(r.answered||{}).answers||{};
h+='<details data-file="'+E(r.file)+'"'+(r===pend&&!localStorage.getItem(sentK)?' open':'')+' style="margin:8px 0"><summary style="cursor:pointer;font-weight:bold">第'+r.round+'轮追问单 · '+(r.answered?'已答 issue#'+E(r.answered.issue)+'（只读）':'待答')+'</summary>';
if(live)h+='<div style="font-size:13px;opacity:.75;margin:6px 0">每题单选；★为推荐（附理由）；D 自填。答复交流程落档后才改稿。</div>';
r.qs.forEach(q=>{const a=A[q.id]||{};h+='<fieldset data-q="'+E(q.id)+'" style="border:1px solid var(--bd,#34353a);border-radius:8px;margin:10px 0;padding:8px 10px"><legend><b>'+E(q.id)+'</b> '+E(q.title)+'</legend>'+(q.intro?'<div style="font-size:13px;opacity:.75">'+E(q.intro)+'</div>':'')
+(q.ctx&&q.ctx.length?'<div style="margin:8px 0;padding:8px 10px;border-radius:6px;background:var(--bg,#1b1c1e);line-height:1.7"><div style="font-size:12px;opacity:.6;margin-bottom:4px">原文上下文（AI 稿）</div>'+q.ctx.map(c=>c.hit?'<div style="margin:4px 0;padding:4px 8px;border-left:4px solid #f0b429;background:rgba(240,180,41,.15);font-weight:bold">¶'+c.p+'　'+E(c.t)+'</div>':'<div style="opacity:.6;font-size:14px;margin:3px 0">¶'+c.p+'　'+E(c.t)+'</div>').join('')+'</div>':'')
+(q.note?'<div style="margin:6px 0;padding:6px 10px;border-left:4px solid var(--ac,#e0705f);background:rgba(224,112,95,.15)"><b style="color:var(--ac,#e0705f)">你的批注：</b>「'+E(q.note)+'」</div>':'')
+(q.fields?q.fields.map(f=>'<div style="margin:4px 0;line-height:1.6"><b>'+E(f.k)+'：</b>'+E(f.v)+'</div>').join(''):'')
+(q.r1?'<div style="margin:6px 0;font-size:13px;opacity:.7;border:1px dashed var(--bd,#34353a);border-radius:6px;padding:4px 8px">第1轮答复（旧视角，仅供参考）：'+E(q.r1)+'</div>':'');
q.opts.forEach(o=>{const chk=a.pick===o.k;h+='<label style="display:block;margin:6px 0;line-height:1.5'+(r.answered&&!chk?';opacity:.5':'')+'"><input type="radio" name="db-'+r.round+'-'+E(q.id)+'" value="'+o.k+'"'+(chk?' checked':'')+(live?'':' disabled')+'> <b>'+o.k+(o.rec?' ★推荐':'')+'</b>　'+E(o.t)+(o.why?'<div style="font-size:13px;opacity:.75;margin-left:22px">理由：'+E(o.why)+'</div>':'')+'</label>';
if(o.fill)h+=live?'<textarea data-for="'+o.k+'" rows="2" placeholder="'+(o.k=='D'?'写下你的答案':'请补充（姓名／取用特征／适用场合等）')+'" style="display:none;width:100%;font:inherit;background:var(--bg,#1b1c1e);color:inherit;border:1px solid var(--bd,#34353a);border-radius:6px;padding:6px"></textarea>':(chk&&a.text?'<div style="margin-left:22px;border-left:3px solid var(--ac,#e0705f);padding-left:8px">你填：'+E(a.text)+'</div>':'')});h+='</fieldset>'});
if(live)h+='<button type="button" class="dbsub big" style="background:var(--ac,#e0705f);color:#fff;border:0;padding:8px 18px;font-size:16px">提交第'+r.round+'轮复盘答复</button> <span class="dbst">'+(localStorage.getItem(sentK)?'✓ 已提交 '+E(localStorage.getItem(sentK)):'')+'</span>';h+='</details>'});
box.innerHTML=h;const wrap=document.querySelector('.wrap');wrap.parentNode.insertBefore(box,wrap);
box.querySelectorAll('fieldset').forEach(f=>f.querySelectorAll('input[type=radio]').forEach(x=>x.onchange=()=>f.querySelectorAll('textarea').forEach(t=>t.style.display=t.dataset.for==x.value?'block':'none')));
box.querySelectorAll('.dbsub').forEach(b=>b.onclick=async()=>{const d=b.closest('details'),file=d.dataset.file,st2=d.querySelector('.dbst');let ans={},miss=[];d.querySelectorAll('fieldset').forEach(f=>{let x=f.querySelector('input:checked');if(!x){miss.push(f.dataset.q);return}let t=f.querySelector('textarea[data-for="'+x.value+'"]');let tx=t?t.value.trim():'';if(t&&x.value=='D'&&!tx)miss.push(f.dataset.q+'（D 未填）');ans[f.dataset.q]={pick:x.value,text:tx}});
if(miss.length){st2.textContent='还没答：'+miss.join('、');return}b.disabled=true;st2.textContent='提交中…';
try{const body=await encText(JSON.stringify({book:P.book,ch:P.title,action:'复盘答复',file,answers:ans}));const is=await postIssue('复盘+'+Math.random().toString(36).slice(2,8),body);if(!is)throw new Error('无提交凭据');const msg='#'+is.number+' '+new Date().toLocaleString();localStorage.setItem('rv-debrief-sent:'+FID+':'+file,msg);st2.textContent='✓ 已提交 '+msg+' · 流程约2分钟内收到'}catch(e){st2.textContent='提交失败：'+e.message;b.disabled=false}})}
try{debriefBox()}catch(e){console.error(e)}
load();
if(P.readOnly){setSubmitting(false);document.querySelectorAll('main p.aedit').forEach(p=>p.classList.remove('aedit'));document.querySelectorAll('main button,main input,#plbar button,#plbar input').forEach(b=>b.disabled=true);st.textContent='正文只读浏览 · '+(P.status||'')}
</script></body></html>
