async function dk(pw,salt){let k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function decText(pw,b){let r=b2u(b);return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:r.slice(16,28)},await dk(pw,r.slice(0,16)),r.slice(28)))}
async function encText(t){let s=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),c=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await dk(PW,s),new TextEncoder().encode(t)));let o=new Uint8Array(28+c.length);o.set(s);o.set(iv,16);o.set(c,28);return u2b(o)}

<script type="text/plain" id="main">
const D=P.paras,DECS=P.decisions||[],K='rv:'+FID+':'+P.fp,DK=K+':dec',TITLE=P.title,BOOK=P.book,CH=P.ch,REPO='https://github.com/r42hgghpkz-lang/review/issues/new';let WVSEL=null,A=[],DEC={},cur=null,pend=null;const $=i=>document.getElementById(i);
const m=$('m'),sd=$('sd'),st=$('st');
function loadDec(){try{DEC=JSON.parse(localStorage.getItem(DK)||'{}')||{}}catch(e){DEC={}}
let mig=false;for(let k in DEC){if(typeof DEC[k]==='string'){DEC[k]={choice:DEC[k],confirmed:true};mig=true}}if(mig)saveDec()}
function saveDec(){try{localStorage.setItem(DK,JSON.stringify(DEC))}catch(e){}}
function apOf(d,o){let a=(d.applies||{})[o];return a&&a.apply!=null?a.apply:null}
function apHint(d,o){let a=apOf(d,o);return a==null?'⚠ 此项无落地句（编辑需补）':(a==='='?'正文不改':'将随锁定改正文为：「'+(a.length>60?a.slice(0,60)+'…':a)+'」')}
function entryOf(d){let e=DEC[d.id];if(e==null)return null;if(typeof e==='string')return{choice:e,confirmed:true};return e}
function choiceOf(d){let e=entryOf(d);return(e&&e.choice)?e.choice:(d.default||(d.options&&d.options[0])||'')}
function isConfirmed(d){let e=entryOf(d);return!!(e&&e.confirmed)}
function pendingDec(){return DECS.filter(d=>!isConfirmed(d)).length}
function confirmedDec(){return DECS.filter(d=>isConfirmed(d)).length}
const TASTE=P.taste||[];function tastePending(){return DECS.filter(d=>TASTE.includes(d.id)&&!isConfirmed(d))}
function updDecBanner(){let bar=$('decbar'),tp=tastePending();if($('lk')){$('lk').disabled=tp.length>0;$('lk').title=tp.length?'口味分歧待拍板：先在下方选定后才能锁定':''}if(!DECS.length){bar.innerHTML='';return}if(TASTE.length&&tp.length){bar.innerHTML='<b style="color:#c0392b">【待拍板】口味分歧 '+tp.length+' 项未选（'+tp.map(d=>d.label).join('、')+'），选定前不能锁定</b>';return}let p=pendingDec(),c=confirmedDec();bar.innerHTML=p?'<b>待确认 '+p+' 项</b> · 已确认 '+c+' 项 · 共 '+DECS.length+' 项；确认后随锁定/打回一并提交':'已确认 '+c+' 项 · 随锁定/打回一并提交'}
function decEl(d){let box=document.createElement('div');box.className='dec';box.dataset.id=d.id;
function paint(){box.innerHTML='';
let lab=document.createElement('div');lab.className='dec-lab';lab.textContent=(d.major?'重大决策 · ':'待决策 · ')+d.label;
let rec=document.createElement('div');rec.className='dec-rec';rec.textContent='推荐：'+(d.default||'')+(d.reason?'｜理由：'+d.reason:'');
box.append(lab,rec);
if(isConfirmed(d)){let st=document.createElement('div');st.className='dec-done';let sp=document.createElement('span');sp.textContent='已确认：'+choiceOf(d);let hn=document.createElement('div');hn.className='dec-rec dec-apply';hn.textContent=apHint(d,choiceOf(d));let btn=document.createElement('button');btn.type='button';btn.className='dec-btn';btn.textContent='改';
btn.onclick=e=>{e.stopPropagation();DEC[d.id]={choice:choiceOf(d),confirmed:false};saveDec();updDecBanner();paint()};st.append(sp,btn);box.append(st,hn)}
else{let opts=document.createElement('div');opts.className='dec-opts';let cur=choiceOf(d);
(d.options||[]).forEach(o=>{let lb=document.createElement('label');let inp=document.createElement('input');inp.type='radio';inp.name='dec-'+d.id;inp.value=o;if(cur===o)inp.checked=true;
inp.onchange=()=>{DEC[d.id]={choice:o,confirmed:false};saveDec()};
if(o===d.default){let tg=document.createElement('span');tg.className='rec-tag';tg.textContent='（推荐）';lb.append(inp,document.createTextNode(' '+o),tg)}else lb.append(inp,document.createTextNode(' '+o));opts.append(lb)});
let act=document.createElement('div');act.className='dec-act';let cf=document.createElement('button');cf.type='button';cf.className='dec-btn dec-cfm';cf.textContent='确认';

+(q.fields?q.fields.map(f=>'<div style="margin:4px 0;line-height:1.6"><b>'+E(f.k)+'：</b>'+E(f.v)+'</div>').join(''):'')
+(q.r1?'<div style="margin:6px 0;font-size:13px;opacity:.7;border:1px dashed var(--bd,#34353a);border-radius:6px;padding:4px 8px">第1轮答复（旧视角，仅供参考）：'+E(q.r1)+'</div>':'');
q.opts.forEach(o=>{const chk=a.pick===o.k;h+='<label style="display:block;margin:6px 0;line-height:1.5'+(r.answered&&!chk?';opacity:.5':'')+'"><input type="radio" name="db-'+r.round+'-'+E(q.id)+'" value="'+o.k+'"'+(chk?' checked':'')+(live?'':' disabled')+'> <b>'+o.k+(o.rec?' ★推荐':'')+'</b>　'+E(o.t)+(o.why?'<div style="font-size:13px;opacity:.75;margin-left:22px">理由：'+E(o.why)+'</div>':'')+'</label>';
if(o.fill)h+=live?'<textarea data-for="'+o.k+'" rows="2" placeholder="'+(o.k=='D'?'写下你的答案':'请补充（姓名／取用特征／适用场合等）')+'" style="display:none;width:100%;font:inherit;background:var(--bg,#1b1c1e);color:inherit;border:1px solid var(--bd,#34353a);border-radius:6px;padding:6px"></textarea>':(chk&&a.text?'<div style="margin-left:22px;border-left:3px solid var(--ac,#e0705f);padding-left:8px">你填：'+E(a.text)+'</div>':'')});h+='</fieldset>'});
if(live)h+='<button type="button" class="dbsub big" style="background:var(--ac,#e0705f);color:#fff;border:0;padding:8px 18px;font-size:16px">提交第'+r.round+'轮复盘答复</button> <span class="dbst">'+(localStorage.getItem(sentK)?'✓ 已提交 '+E(localStorage.getItem(sentK)):'')+'</span>';h+='</details>'});
box.innerHTML=h;document.querySelector('.wrap').after(box);
box.querySelectorAll('fieldset').forEach(f=>f.querySelectorAll('input[type=radio]').forEach(x=>x.onchange=()=>f.querySelectorAll('textarea').forEach(t=>t.style.display=t.dataset.for==x.value?'block':'none')));
box.querySelectorAll('.dbsub').forEach(b=>b.onclick=async()=>{const d=b.closest('details'),file=d.dataset.file,st2=d.querySelector('.dbst');let ans={},miss=[];d.querySelectorAll('fieldset').forEach(f=>{let x=f.querySelector('input:checked');if(!x){miss.push(f.dataset.q);return}let t=f.querySelector('textarea[data-for="'+x.value+'"]');let tx=t?t.value.trim():'';if(t&&x.value=='D'&&!tx)miss.push(f.dataset.q+'（D 未填）');ans[f.dataset.q]={pick:x.value,text:tx}});
if(miss.length){st2.textContent='还没答：'+miss.join('、');return}b.disabled=true;st2.textContent='提交中…';
try{const body=await encText(JSON.stringify({book:P.book,ch:P.title,action:'复盘答复',file,answers:ans}));const is=await postIssue('复盘+'+Math.random().toString(36).slice(2,8),body);if(!is)throw new Error('无提交凭据');const msg='#'+is.number+' '+new Date().toLocaleString();localStorage.setItem('rv-debrief-sent:'+FID+':'+file,msg);st2.textContent='✓ 已提交 '+msg+' · 流程约2分钟内收到'}catch(e){st2.textContent='提交失败：'+e.message;b.disabled=false}})}
try{debriefBox()}catch(e){console.error(e)}
load();
$('st').setAttribute('role','status');$('st').setAttribute('aria-live','polite');
const headerEl=document.querySelector('header');if(typeof ResizeObserver!=='undefined')new ResizeObserver(()=>document.documentElement.style.setProperty('--header-h',headerEl.offsetHeight+'px')).observe(headerEl);
if(P.readOnly){setSubmitting(false);document.querySelectorAll('main p.aedit').forEach(p=>p.classList.remove('aedit'));document.querySelectorAll('main button,main input,#plbar button,#plbar input').forEach(b=>b.disabled=true);st.textContent='正文只读浏览 · '+(P.status||'')}
</script></body></html>
